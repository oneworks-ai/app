# eslint-disable max-lines
name: Release Tags
on:
  pull_request:
    branches:
      - main
    paths:
      - .github/workflows/release-tags.yml
      - .github/workflows/vscode-extension-release.yml
      - apps/**/package.json
      - apps/vscode-extension/scripts/**
      - packages/**/package.json
      - scripts/release-tags-preplan.cjs
      - scripts/release-tags-preplan.d.cts
      - scripts/release-tags.ts
      - scripts/cli-package-release.ts
      - scripts/cli.ts
      - scripts/run-tools.mjs
      - scripts/workspace-dependency-bootstrap.mjs
      - scripts/workspace-submodule-bootstrap.mjs
      - scripts/stable-release-preflight.mjs
      - scripts/release-security-audit.mjs
      - scripts/publish-plan-core.mjs
      - scripts/windows-installer-identity.cjs
      - scripts/__tests__/release-tags.spec.ts
      - scripts/__tests__/vscode-extension-release.spec.ts
  push:
    branches:
      - main
    paths:
      - .github/workflows/release-tags.yml
      - .github/workflows/vscode-extension-release.yml
      - apps/**/package.json
      - apps/vscode-extension/scripts/**
      - packages/**/package.json
      - scripts/release-tags-preplan.cjs
      - scripts/release-tags-preplan.d.cts
      - scripts/release-tags.ts
      - scripts/cli-package-release.ts
      - scripts/cli.ts
      - scripts/run-tools.mjs
      - scripts/workspace-dependency-bootstrap.mjs
      - scripts/workspace-submodule-bootstrap.mjs
      - scripts/stable-release-preflight.mjs
      - scripts/release-security-audit.mjs
      - scripts/publish-plan-core.mjs
      - scripts/windows-installer-identity.cjs
      - scripts/__tests__/release-tags.spec.ts
      - scripts/__tests__/vscode-extension-release.spec.ts
  workflow_dispatch:
    inputs:
      base:
        description: Base commit to compare. Defaults to the previous commit for the selected ref.
        required: false
        type: string
      head:
        description: Head commit to compare. Defaults to the selected ref SHA.
        required: false
        type: string
permissions:
  contents: read
env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"
concurrency:
  group: release-tags-${{ github.ref }}
  cancel-in-progress: false
jobs:
  plan:
    name: release-tags
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    outputs:
      count: ${{ steps.plan.outputs.count }}
      head: ${{ steps.range.outputs.head }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Resolve release tag range
        id: range
        shell: bash
        run: |
          initial=false
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            base="${{ github.event.pull_request.base.sha }}"
            head="${{ github.event.pull_request.head.sha }}"
          elif [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            base="${{ inputs.base }}"
            head="${{ inputs.head }}"
            if [ -z "$head" ]; then head="${{ github.sha }}"; fi
            if [ -z "$base" ] && ! base="$(git rev-parse "$head^" 2>/dev/null)"; then base=""; fi
          else
            base="${{ github.event.before }}"
            head="${{ github.sha }}"
          fi
          if [ -z "$base" ] || [[ "$base" =~ ^0+$ ]] || ! git cat-file -e "$base^{commit}" 2>/dev/null; then
            initial=true
            base=""
          fi
          echo "base=$base" >> "$GITHUB_OUTPUT"
          echo "head=$head" >> "$GITHUB_OUTPUT"
          echo "initial=$initial" >> "$GITHUB_OUTPUT"
      - name: Preplan release tag work
        id: preplan
        shell: bash
        run: |
          set -euo pipefail
          if [[ "${{ steps.range.outputs.initial }}" == "true" ]]; then
            echo "heavy=true" >> "$GITHUB_OUTPUT"
          else
            node scripts/release-tags-preplan.cjs "${{ steps.range.outputs.base }}" "${{ steps.range.outputs.head }}" | tee "$RUNNER_TEMP/release-tags-preplan.json"
          fi
      - name: Checkout release planner submodules
        if: steps.preplan.outputs.heavy == 'true'
        run: git submodule update --init --depth 1 -- assets/avatar assets/demo-video
      - name: Setup pnpm
        if: steps.preplan.outputs.heavy == 'true'
        uses: pnpm/action-setup@v4
        with:
          version: 11.7.0
      - name: Setup Node.js
        if: steps.preplan.outputs.heavy == 'true'
        uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
          cache: pnpm
      - name: Install dependencies
        if: steps.preplan.outputs.heavy == 'true'
        run: pnpm install --frozen-lockfile
      - name: Audit production dependencies
        if: steps.preplan.outputs.heavy == 'true'
        run: pnpm security:audit:production
      - name: Validate stable release identity
        if: steps.preplan.outputs.heavy == 'true'
        shell: bash
        run: |
          set -euo pipefail
          version="$(node -p "require('./apps/bootstrap/package.json').version")"
          if [[ "$version" == *-* ]]; then
            echo "Prerelease identity detected; stable-only validation is not required."
            exit 0
          fi
          node ./scripts/stable-release-preflight.mjs --version "$version"
      - name: Test release tag and store version guards
        if: steps.preplan.outputs.heavy == 'true'
        run: >-
          pnpm exec vitest run --workspace vitest.workspace.ts --project node
          scripts/__tests__/release-tags.spec.ts
          scripts/__tests__/vscode-extension-release.spec.ts
      - name: Plan release tags
        id: plan
        shell: bash
        run: |
          set -euo pipefail
          case "${{ steps.preplan.outputs.heavy }}" in
            true|false) ;;
            *) echo "Release preplan emitted an invalid heavy contract." >&2; exit 1 ;;
          esac
          if [ "${{ steps.preplan.outputs.heavy }}" != "true" ]; then
            echo 'count=0' >> "$GITHUB_OUTPUT"
            echo 'No release authority or identity change; skipped heavyweight release planning.'
            exit 0
          fi
          if [ "${{ steps.range.outputs.initial }}" = "true" ]; then
            echo "Planning initial release tags because no comparable base commit is available."
          fi
          pnpm --silent tools release-tags plan "${{ steps.range.outputs.base }}" "${{ steps.range.outputs.head }}" --json \
            | tee "$RUNNER_TEMP/release-tags.json"
          count="$(PLAN_FILE="$RUNNER_TEMP/release-tags.json" EXPECTED_BASE="${{ steps.range.outputs.base }}" EXPECTED_HEAD="${{ steps.range.outputs.head }}" node <<'NODE'
          const fs = require('node:fs')
          const plan = JSON.parse(fs.readFileSync(process.env.PLAN_FILE, 'utf8'))
          if (plan == null || typeof plan !== 'object' || !Array.isArray(plan.tags)) {
            throw new Error('Release tag planner emitted an invalid plan shape.')
          }
          if (plan.base !== process.env.EXPECTED_BASE || plan.head !== process.env.EXPECTED_HEAD) {
            throw new Error('Release tag planner did not bind its plan to the resolved immutable range.')
          }
          console.log(plan.tags.length)
          NODE
          )"
          echo "count=$count" >> "$GITHUB_OUTPUT"
          echo "Planned $count release tag(s)."
      - name: Upload release tag plan
        if: github.event_name == 'push' && github.ref == 'refs/heads/main' && steps.plan.outputs.count != '0'
        uses: actions/upload-artifact@v4
        with:
          name: release-tags-plan-${{ github.run_id }}
          path: ${{ runner.temp }}/release-tags.json
          if-no-files-found: error
          retention-days: 1
  create-tags:
    name: create-release-tags
    needs: plan
    if: github.event_name == 'push' && github.ref == 'refs/heads/main' && needs.plan.outputs.count != '0'
    runs-on: ubuntu-latest
    environment: Production
    timeout-minutes: 10
    permissions:
      actions: write
      contents: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Download release tag plan
        uses: actions/download-artifact@v4
        with:
          name: release-tags-plan-${{ github.run_id }}
          path: ${{ runner.temp }}
      - name: Create release tags
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          git config user.name "oneworks-release-bot"
          git config user.email "release-bot@users.noreply.github.com"
          PLAN_FILE="$RUNNER_TEMP/release-tags.json" node <<'NODE' > "$RUNNER_TEMP/release-tags.tsv"
          const fs = require('node:fs')
          const plan = JSON.parse(fs.readFileSync(process.env.PLAN_FILE, 'utf8'))
          for (const item of plan.tags) {
            console.log([
              item.tag,
              item.name,
              item.version,
              item.path,
              item.desktopSigningPolicy ?? ''
            ].join('\t'))
          }
          NODE
          dispatch_chrome_extension_release() {
            local tag="$1"
            local publish_store="$2"
            echo "Dispatching Chrome extension release workflow for $tag (publish_store=$publish_store)"
            gh workflow run chrome-extension-release.yml \
              --repo "$GITHUB_REPOSITORY" \
              --ref "$tag" \
              -f release_tag="$tag" \
              -f publish_store="$publish_store"
          }
          while IFS=$'\t' read -r tag name version package_path desktop_signing_policy; do
            if [ -z "$tag" ]; then
              continue
            fi
            case "$tag" in
              pkg/oneworks-desktop/v*)
                case "$desktop_signing_policy" in
                  auto|signed|unsigned) ;;
                  *)
                    echo "Desktop release tag $tag is missing a valid immutable signing policy." >&2
                    exit 1
                    ;;
                esac
                ;;
            esac
            if git rev-parse -q --verify "refs/tags/$tag" >/dev/null; then
              echo "Release tag already exists: $tag"
              case "$tag" in
                pkg/oneworks-plugin-external-browser-driver/v*)
                  dispatch_chrome_extension_release "$tag" false
                  ;;
              esac
              continue
            fi
            echo "Creating $tag for $name@$version from $package_path"
            git tag -a "$tag" "${{ needs.plan.outputs.head }}" -m "Release $name@$version"
            git push origin "refs/tags/$tag"
            case "$tag" in
              pkg/oneworks-desktop/v*)
                echo "Dispatching desktop package workflow for $tag"
                gh workflow run desktop-package.yml \
                  --repo "$GITHUB_REPOSITORY" \
                  --ref "$tag" \
                  -f create_release=true \
                  -f release_tag="$tag" \
                  -f signing_policy="$desktop_signing_policy" \
                  -f retention_days=14
                ;;
              pkg/oneworks-plugin-external-browser-driver/v*)
                # A Store submission remains an explicit, state-audited action:
                # an earlier version can still be pending external review.
                dispatch_chrome_extension_release "$tag" false
                ;;
              *)
                echo "No automated workflow dispatch configured for $tag"
                ;;
            esac
          done < "$RUNNER_TEMP/release-tags.tsv"
