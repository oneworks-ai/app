# eslint-disable max-lines
name: VS Code Extension Release

on:
  workflow_dispatch:
    inputs:
      release_tag:
        description: Release tag to package. Must start with pkg/oneworks-vscode-extension/v.
        required: true
        type: string

permissions:
  contents: write

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"
  VSCODE_EXTENSION_RELEASE_TAG_PREFIX: pkg/oneworks-vscode-extension/v

concurrency:
  group: vscode-extension-release-${{ inputs.release_tag }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    outputs:
      archive_file: oneworks-vscode-extension-v${{ steps.version.outputs.value }}.vsix
      artifact_name: oneworks-vscode-extension-v${{ steps.version.outputs.value }}
      publisher: ${{ steps.version.outputs.publisher }}
      release_tag: ${{ steps.version.outputs.tag }}
      source_sha: ${{ steps.version.outputs.source_sha }}
      version: ${{ steps.version.outputs.value }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: refs/tags/${{ inputs.release_tag }}
      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11.7.0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Validate release version
        id: version
        env:
          INPUT_RELEASE_TAG: ${{ inputs.release_tag }}
          VSCODE_EXTENSION_PUBLISHER: ${{ vars.VSCODE_EXTENSION_PUBLISHER }}
        run: |
          set -euo pipefail
          TAG_NAME="$INPUT_RELEASE_TAG"
          PACKAGE_VERSION=$(node -p "JSON.parse(require('fs').readFileSync('apps/vscode-extension/package.json', 'utf8')).version")
          case "$TAG_NAME" in
            ${VSCODE_EXTENSION_RELEASE_TAG_PREFIX}*) ;;
            *)
              echo "VS Code extension release tags must start with ${VSCODE_EXTENSION_RELEASE_TAG_PREFIX}." >&2
              exit 1
              ;;
          esac
          TAG_VERSION="${TAG_NAME#${VSCODE_EXTENSION_RELEASE_TAG_PREFIX}}"
          PUBLISHER="${VSCODE_EXTENSION_PUBLISHER:-oneworks-ai}"
          node -e "require('./apps/vscode-extension/scripts/release-identity.cjs').assertStableVscodeReleaseTag(process.argv[1])" "$TAG_NAME"
          TAG_OBJECT_TYPE=$(git cat-file -t "refs/tags/$TAG_NAME")
          TAG_COMMIT=$(git rev-parse "refs/tags/${TAG_NAME}^{commit}")
          HEAD_COMMIT=$(git rev-parse HEAD)

          if [ "$TAG_OBJECT_TYPE" != "tag" ]; then
            echo "VS Code extension publication requires an annotated release tag; $TAG_NAME is $TAG_OBJECT_TYPE." >&2
            exit 1
          fi
          if [ "$TAG_VERSION" != "$PACKAGE_VERSION" ]; then
            echo "Tag version ($TAG_VERSION) does not match VS Code extension version ($PACKAGE_VERSION)." >&2
            exit 1
          fi
          if [ "$TAG_COMMIT" != "$HEAD_COMMIT" ]; then
            echo "Checked out source ($HEAD_COMMIT) does not match peeled release tag commit ($TAG_COMMIT)." >&2
            exit 1
          fi

          echo "value=$PACKAGE_VERSION" >> "$GITHUB_OUTPUT"
          echo "file=oneworks-vscode-extension-v$PACKAGE_VERSION.vsix" >> "$GITHUB_OUTPUT"
          echo "archive=apps/vscode-extension/oneworks-vscode-extension-v$PACKAGE_VERSION.vsix" >> "$GITHUB_OUTPUT"
          echo "publisher=$PUBLISHER" >> "$GITHUB_OUTPUT"
          echo "source_sha=$TAG_COMMIT" >> "$GITHUB_OUTPUT"
          echo "tag=$TAG_NAME" >> "$GITHUB_OUTPUT"

      - name: Typecheck extension
        run: pnpm --filter @oneworks/vscode-extension typecheck

      - name: Build extension
        run: pnpm --filter @oneworks/vscode-extension build

      - name: Package VSIX
        env:
          ARCHIVE_FILE: ${{ steps.version.outputs.file }}
          VSCODE_EXTENSION_PUBLISHER: ${{ steps.version.outputs.publisher }}
        run: pnpm --filter @oneworks/vscode-extension package:vsix -- --out "$ARCHIVE_FILE"

      - name: Upload extension artifact
        uses: actions/upload-artifact@v4
        with:
          name: oneworks-vscode-extension-v${{ steps.version.outputs.value }}
          path: ${{ steps.version.outputs.archive }}
          if-no-files-found: error
          retention-days: 14

  release:
    needs: build
    runs-on: ubuntu-latest
    environment: Production
    timeout-minutes: 20

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: refs/tags/${{ needs.build.outputs.release_tag }}

      - name: Validate immutable release source
        env:
          EXPECTED_SOURCE_SHA: ${{ needs.build.outputs.source_sha }}
          RELEASE_TAG: ${{ needs.build.outputs.release_tag }}
        run: |
          TAG_COMMIT=$(git rev-parse "refs/tags/${RELEASE_TAG}^{commit}")
          HEAD_COMMIT=$(git rev-parse HEAD)
          if [ "$TAG_COMMIT" != "$EXPECTED_SOURCE_SHA" ] || [ "$HEAD_COMMIT" != "$EXPECTED_SOURCE_SHA" ]; then
            echo "Release checkout, peeled tag commit, and build source SHA must match." >&2
            exit 1
          fi

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11.7.0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Download packaged extension
        uses: actions/download-artifact@v4
        with:
          name: ${{ needs.build.outputs.artifact_name }}
          path: dist/run

      - name: Validate publication credentials
        env:
          OVSX_PAT: ${{ secrets.OVSX_PAT }}
          VSCE_PAT: ${{ secrets.VSCE_PAT }}
          VSCODE_EXTENSION_PUBLISHER: ${{ vars.VSCODE_EXTENSION_PUBLISHER }}
        run: |
          set -euo pipefail
          if [ -z "$VSCODE_EXTENSION_PUBLISHER" ]; then
            echo "VSCODE_EXTENSION_PUBLISHER is required for stable VS Code publication." >&2
            exit 1
          fi
          if [ -z "$VSCE_PAT" ]; then
            echo "VSCE_PAT is required for stable VS Code publication." >&2
            exit 1
          fi
          if [ -z "$OVSX_PAT" ]; then
            echo "OVSX_PAT is required for stable VS Code publication." >&2
            exit 1
          fi

      - name: Persist immutable VSIX candidate
        id: candidate
        env:
          ARCHIVE_FILE: ${{ needs.build.outputs.archive_file }}
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ needs.build.outputs.release_tag }}
          VERSION: ${{ needs.build.outputs.version }}
        run: |
          set -euo pipefail
          release_json="$RUNNER_TEMP/vscode-existing-release.json"
          candidate_dir="$RUNNER_TEMP/vscode-authoritative-candidate"
          run_archive="$GITHUB_WORKSPACE/dist/run/$ARCHIVE_FILE"
          candidate_archive="$candidate_dir/$ARCHIVE_FILE"
          mkdir -p "$candidate_dir"
          test -f "$run_archive"

          candidate_args=(
            --tag "$RELEASE_TAG"
            --archive "$ARCHIVE_FILE"
            --version "$VERSION"
          )
          if gh release view "$RELEASE_TAG" --json assets,isDraft,isPrerelease,tagName > "$release_json" 2>/dev/null; then
            candidate_args+=(--release-json "$release_json")
          fi
          candidate_action=$(node apps/vscode-extension/scripts/resolve-release-candidate.mjs "${candidate_args[@]}")

          guard_args=("$RELEASE_TAG")
          if [ "$candidate_action" = 'reuse' ]; then
            guard_args+=(--recovery-evidence)
          fi
          node apps/vscode-extension/scripts/guard-store-version.mjs "${guard_args[@]}"

          case "$candidate_action" in
            create)
              release_flags=(--latest=false)
              gh release create "$RELEASE_TAG" "$run_archive" \
                --title "VS Code Extension v$VERSION" \
                --notes "Immutable VS Code extension candidate for v$VERSION." \
                "${release_flags[@]}"
              ;;
            upload)
              gh release upload "$RELEASE_TAG" "$run_archive"
              ;;
            reuse)
              echo "Reusing persisted VSIX candidate for $RELEASE_TAG."
              ;;
            *)
              echo "Unknown candidate action: $candidate_action" >&2
              exit 1
              ;;
          esac

          gh release download "$RELEASE_TAG" \
            --pattern "$ARCHIVE_FILE" \
            --dir "$candidate_dir"
          test -f "$candidate_archive"
          candidate_sha256=$(sha256sum "$candidate_archive" | awk '{print $1}')
          echo "Authoritative VSIX SHA-256: $candidate_sha256"
          echo "archive=$candidate_archive" >> "$GITHUB_OUTPUT"
          echo "sha256=$candidate_sha256" >> "$GITHUB_OUTPUT"

      - name: Verify authoritative VSIX identity
        env:
          ARCHIVE_FILE: ${{ steps.candidate.outputs.archive }}
          VERSION: ${{ needs.build.outputs.version }}
        run: node apps/vscode-extension/scripts/verify-vsix-file.mjs "$ARCHIVE_FILE" "$VERSION"

      - name: Publish to VS Code Marketplace
        id: vscode_marketplace
        continue-on-error: true
        env:
          ARCHIVE_FILE: ${{ steps.candidate.outputs.archive }}
          VSCODE_EXTENSION_PUBLISHER: ${{ vars.VSCODE_EXTENSION_PUBLISHER }}
          VSCE_PAT: ${{ secrets.VSCE_PAT }}
        run: |
          pnpm --filter @oneworks/vscode-extension publish:vsix -- --packagePath "$ARCHIVE_FILE"

      - name: Publish to Open VSX Registry
        env:
          ARCHIVE_FILE: ${{ steps.candidate.outputs.archive }}
          OVSX_PAT: ${{ secrets.OVSX_PAT }}
          PUBLISHER: ${{ needs.build.outputs.publisher }}
          VERSION: ${{ needs.build.outputs.version }}
        run: |
          pnpm dlx ovsx@1.0.1 verify-pat "$PUBLISHER" -p "$OVSX_PAT"

          publish_args=(publish --skip-duplicate)
          publish_args+=("$ARCHIVE_FILE")

          pnpm dlx ovsx@1.0.1 "${publish_args[@]}" -p "$OVSX_PAT"

      - name: Report VS Code Marketplace publish failure
        if: steps.vscode_marketplace.outcome == 'failure'
        run: |
          echo "VS Code Marketplace publish failed after the remaining release targets completed." >&2
          exit 1
