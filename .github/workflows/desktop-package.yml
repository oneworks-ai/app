name: Desktop Package
run-name: Desktop package (${{ github.ref_name }})

env:
  DESKTOP_RELEASE_TAG_PREFIX: pkg/oneworks-desktop/v
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"
  NODE_OPTIONS: --max-old-space-size=4096

concurrency:
  group: desktop-package-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

on:
  pull_request:
    branches:
      - main
  push:
    tags:
      - "pkg/oneworks-desktop/v*"
  schedule:
    - cron: "0 18 * * *"
  workflow_dispatch:
    inputs:
      candidate_run_id:
        description: Successful Desktop Package run id whose verified candidate artifact should be promoted without rebuilding.
        required: false
        type: string
      builder_source_sha:
        description: Reviewed protected-main workflow tooling commit. Required with product_source_sha and exact-release replacement.
        required: false
        type: string
      create_release:
        default: false
        description: Create or update a GitHub Release with the generated artifacts.
        required: false
        type: boolean
      notarization_history_only:
        default: false
        description: Query Apple notarization history without building, submitting, releasing, or changing artifacts.
        required: false
        type: boolean
      notarization_run_id:
        description: Prior Desktop Package run whose exact notarization recovery artifact should be resumed without resubmission.
        required: false
        type: string
      notarization_stage:
        description: Recovery stage from notarization_run_id; must be app or installer.
        required: false
        type: string
      product_source_sha:
        description: Optional immutable product commit to rebuild with the reviewed workflow tooling. Must equal the peeled release tag.
        required: false
        type: string
      replace_existing_release:
        default: false
        description: Explicitly authorize a recoverable in-place replacement of an existing release asset set.
        required: false
        type: boolean
      release_tag:
        description: Release identity for a candidate build or promotion. Must start with pkg/oneworks-desktop/v.
        required: false
        type: string
      signing_policy:
        default: auto
        description: Requested signing policy. Official tags remain bound to apps/desktop/package.json metadata.
        options:
          - auto
          - signed
          - unsigned
        required: false
        type: choice
      retention_days:
        default: "14"
        description: Number of days to keep workflow artifacts.
        required: false
        type: number

permissions:
  actions: read
  contents: read

jobs:
  pr-policy:
    name: macOS installer
    if: github.event_name == 'pull_request'
    runs-on: macos-26
    timeout-minutes: 60
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Classify validation scope
        id: validation_scope
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: >-
          node scripts/pr-validation-scope.cjs
          --base "$BASE_SHA"
          --head "$HEAD_SHA"
          --github-output "$GITHUB_OUTPUT"
          --json

      - name: Validate classifier output contract
        env:
          DOCS_ONLY: ${{ steps.validation_scope.outputs.docs_only }}
          FULL: ${{ steps.validation_scope.outputs.full }}
        shell: bash
        run: |
          set -euo pipefail
          [[ "$DOCS_ONLY" == "true" || "$DOCS_ONLY" == "false" ]]
          [[ "$FULL" == "true" || "$FULL" == "false" ]]
          [[ "$DOCS_ONLY" != "$FULL" ]]

      - name: Confirm docs-only installer exclusion
        if: steps.validation_scope.outputs.docs_only == 'true'
        run: echo "No Desktop source, workflow, configuration, manifest, lockfile, script, or test path changed; installer packaging is not applicable."

      - name: Setup pnpm
        if: steps.validation_scope.outputs.docs_only != 'true'
        uses: pnpm/action-setup@v4
        with:
          version: 11.7.0

      - name: Setup Node.js
        if: steps.validation_scope.outputs.docs_only != 'true'
        uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
          cache: pnpm

      - name: Install dependencies
        if: steps.validation_scope.outputs.docs_only != 'true'
        run: pnpm install --frozen-lockfile

      - name: Confirm release-only packaging policy
        if: steps.validation_scope.outputs.docs_only != 'true'
        run: echo "Full-scope pull requests build unsigned app bundles for authority smoke only; installers, signing, and promotion remain release-only."

      - name: Run desktop package preflight
        if: steps.validation_scope.outputs.docs_only != 'true'
        run: pnpm -C apps/desktop test:package-preflight

      - name: Verify source native authority closure
        if: steps.validation_scope.outputs.docs_only != 'true'
        run: pnpm -C packages/fs-authority-native verify:prebuilds

      - name: Package unsigned macOS authority candidates
        if: steps.validation_scope.outputs.docs_only != 'true'
        env:
          ONEWORKS_DESKTOP_ARCHS: arm64,x64
          ONEWORKS_DESKTOP_ENABLE_AUTO_UPDATE: "false"
          ONEWORKS_DESKTOP_OFFICIAL_RELEASE_BUILD: "false"
          ONEWORKS_DESKTOP_RELEASE_BUILD: "false"
        run: pnpm desktop:package

      - name: Verify packaged native authority closure
        if: steps.validation_scope.outputs.docs_only != 'true'
        shell: bash
        run: |
          set -euo pipefail
          for arch in arm64 x64; do
            package_dir="$(find apps/desktop/out -mindepth 1 -maxdepth 1 -type d -name "*-darwin-$arch" -print -quit)"
            if [[ -z "$package_dir" ]]; then
              echo "Missing packaged app directory for $arch." >&2
              exit 1
            fi
            app_dir="$(find "$package_dir" -mindepth 1 -maxdepth 1 -type d -name '*.app' -print -quit)"
            if [[ -z "$app_dir" ]]; then
              echo "Missing packaged app bundle for $arch." >&2
              exit 1
            fi
            authority_root="$app_dir/Contents/Resources/app/node_modules/.pnpm/node_modules/@oneworks/fs-authority-native"
            node packages/fs-authority-native/scripts/verify-darwin-prebuilds.mjs "$authority_root"
          done

      - name: Smoke packaged arm64 authority server
        if: steps.validation_scope.outputs.docs_only != 'true'
        env:
          ONEWORKS_DESKTOP_SMOKE_ARCH: arm64
        run: pnpm -C apps/desktop smoke:package

  dispatch-policy:
    name: Desktop workflow request
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - name: Validate desktop workflow request
        env:
          BUILDER_SOURCE_SHA: ${{ inputs.builder_source_sha }}
          CANDIDATE_RUN_ID: ${{ inputs.candidate_run_id }}
          CREATE_RELEASE_REQUESTED: ${{ inputs.create_release }}
          NOTARIZATION_HISTORY_ONLY: ${{ inputs.notarization_history_only }}
          NOTARIZATION_RUN_ID: ${{ inputs.notarization_run_id }}
          NOTARIZATION_STAGE: ${{ inputs.notarization_stage }}
          PRODUCT_SOURCE_SHA: ${{ inputs.product_source_sha }}
          RELEASE_TAG_INPUT: ${{ inputs.release_tag }}
          REPLACE_EXISTING_RELEASE: ${{ inputs.replace_existing_release }}
          SIGNING_POLICY: ${{ inputs.signing_policy }}
        shell: bash
        run: |
          SIGNING_POLICY="${SIGNING_POLICY:-auto}"
          case "$SIGNING_POLICY" in
            auto|signed|unsigned) ;;
            *)
              echo "signing_policy must be auto, signed, or unsigned." >&2
              exit 1
              ;;
          esac
          if [[ "$NOTARIZATION_HISTORY_ONLY" == "true" ]]; then
            if [[ "$CREATE_RELEASE_REQUESTED" == "true" || -n "$BUILDER_SOURCE_SHA" || -n "$CANDIDATE_RUN_ID" || -n "$NOTARIZATION_RUN_ID" || -n "$NOTARIZATION_STAGE" || -n "$PRODUCT_SOURCE_SHA" || -n "$RELEASE_TAG_INPUT" || "$REPLACE_EXISTING_RELEASE" == "true" || "$SIGNING_POLICY" != "auto" ]]; then
              echo "notarization_history_only cannot be combined with build, promotion, or recovery inputs." >&2
              exit 1
            fi
            exit 0
          fi
          if [[ -n "$NOTARIZATION_RUN_ID" || -n "$NOTARIZATION_STAGE" ]]; then
            if [[ ! "$NOTARIZATION_RUN_ID" =~ ^[0-9]+$ ]]; then
              echo "notarization_run_id must be a numeric GitHub Actions run id." >&2
              exit 1
            fi
            if [[ "$NOTARIZATION_STAGE" != "app" && "$NOTARIZATION_STAGE" != "installer" ]]; then
              echo "notarization_stage must be app or installer." >&2
              exit 1
            fi
            if [[ -n "$BUILDER_SOURCE_SHA" || -n "$CANDIDATE_RUN_ID" || -n "$PRODUCT_SOURCE_SHA" || "$REPLACE_EXISTING_RELEASE" == "true" ]]; then
              echo "notarization recovery cannot be combined with product rebuild, candidate promotion, or release replacement." >&2
              exit 1
            fi
            if [[ "$SIGNING_POLICY" == "unsigned" ]]; then
              echo "notarization recovery cannot change the effective signing policy to unsigned." >&2
              exit 1
            fi
          fi
          if [[ "$CREATE_RELEASE_REQUESTED" == "true" && -z "$RELEASE_TAG_INPUT" ]]; then
            echo "release_tag is required when create_release is enabled manually." >&2
            exit 1
          fi
          if [[ -n "$CANDIDATE_RUN_ID" ]]; then
            if [[ "$CREATE_RELEASE_REQUESTED" != "true" ]]; then
              echo "candidate_run_id can only be used when create_release is enabled." >&2
              exit 1
            fi
            if [[ ! "$CANDIDATE_RUN_ID" =~ ^[0-9]+$ ]]; then
              echo "candidate_run_id must be a numeric GitHub Actions run id." >&2
              exit 1
            fi
          fi
          if [[ -n "$PRODUCT_SOURCE_SHA" ]]; then
            if [[ ! "$PRODUCT_SOURCE_SHA" =~ ^[0-9a-fA-F]{40}$ ]]; then
              echo "product_source_sha must be a full 40-character Git commit SHA." >&2
              exit 1
            fi
            if [[ -z "$RELEASE_TAG_INPUT" ]]; then
              echo "release_tag is required when product_source_sha is provided." >&2
              exit 1
            fi
            if [[ -n "$CANDIDATE_RUN_ID" ]]; then
              echo "product_source_sha cannot be combined with candidate_run_id." >&2
              exit 1
            fi
            if [[ ! "$BUILDER_SOURCE_SHA" =~ ^[0-9a-fA-F]{40}$ ]]; then
              echo "builder_source_sha must be a full 40-character Git commit SHA when product_source_sha is provided." >&2
              exit 1
            fi
          elif [[ -n "$BUILDER_SOURCE_SHA" ]]; then
            echo "builder_source_sha is only supported with product_source_sha." >&2
            exit 1
          fi
          if [[ "$REPLACE_EXISTING_RELEASE" == "true" ]]; then
            if [[ "$CREATE_RELEASE_REQUESTED" != "true" || -z "$PRODUCT_SOURCE_SHA" ]]; then
              echo "replace_existing_release requires create_release=true and product_source_sha." >&2
              exit 1
            fi
          fi

  notarization-history:
    name: Apple notarization history
    needs: dispatch-policy
    if: github.event_name == 'workflow_dispatch' && inputs.notarization_history_only
    runs-on: macos-26
    environment: Production
    timeout-minutes: 10
    steps:
      - name: Checkout release tooling
        uses: actions/checkout@v4

      - name: Query Apple notarization history
        env:
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_ID_PASSWORD: ${{ secrets.APPLE_ID_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: node apps/desktop/scripts/notarization-state.cjs history

  package:
    name: macOS release installer
    needs: dispatch-policy
    if: >-
      always() &&
      (needs.dispatch-policy.result == 'success' || needs.dispatch-policy.result == 'skipped') &&
      github.event_name != 'pull_request' &&
      !(github.event_name == 'workflow_dispatch' && inputs.notarization_history_only) &&
      !(github.event_name == 'workflow_dispatch' && inputs.create_release && inputs.candidate_run_id != '')
    runs-on: macos-26
    environment: ${{ github.event_name == 'schedule' && 'Preview' || 'Production' }}
    timeout-minutes: 120
    outputs:
      signed: ${{ steps.desktop_build_policy.outputs.sign }}

    steps:
      - name: Checkout release tooling
        uses: actions/checkout@v4

      - name: Download notarization recovery state
        if: github.event_name == 'workflow_dispatch' && inputs.notarization_run_id != ''
        uses: actions/download-artifact@v4
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          name: desktop-${{ inputs.notarization_stage }}-notarization-recovery
          path: ${{ runner.temp }}/oneworks-desktop-notarization-recovery
          repository: ${{ github.repository }}
          run-id: ${{ inputs.notarization_run_id }}

      - name: Inspect notarization recovery state
        id: notarization_recovery
        if: github.event_name == 'workflow_dispatch' && inputs.notarization_run_id != ''
        env:
          EXPECTED_STAGE: ${{ inputs.notarization_stage }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          NOTARIZATION_RUN_ID: ${{ inputs.notarization_run_id }}
          REQUESTED_RELEASE_TAG: ${{ inputs.release_tag }}
          STATE_DIR: ${{ runner.temp }}/oneworks-desktop-notarization-recovery
        shell: bash
        run: |
          run_path="$RUNNER_TEMP/oneworks-notarization-source-run.json"
          gh api "repos/$GITHUB_REPOSITORY/actions/runs/$NOTARIZATION_RUN_ID" > "$run_path"
          node - "$STATE_DIR" "$EXPECTED_STAGE" "$REQUESTED_RELEASE_TAG" "$GITHUB_OUTPUT" "$run_path" <<'NODE'
          const fs = require('node:fs')
          const path = require('node:path')
          const [stateDir, expectedStage, requestedReleaseTag, outputPath, runPath] = process.argv.slice(2)
          const state = JSON.parse(fs.readFileSync(path.join(stateDir, 'notarization-state.json'), 'utf8'))
          const run = JSON.parse(fs.readFileSync(runPath, 'utf8'))
          const provenance = state.artifactProvenance ?? {}
          if (
            state.schemaVersion !== 1 ||
            state.stage !== expectedStage ||
            !/^[0-9a-f]{40}$/i.test(state.sourceSha) ||
            !/^[0-9a-f]{40}$/i.test(state.builderSha) ||
            typeof state.buildBranch !== 'string' ||
            state.buildBranch === '' ||
            /[\r\n]/.test(state.buildBranch) ||
            Number.isNaN(Date.parse(state.buildTime)) ||
            String(run.id) !== provenance.runId ||
            run.run_attempt !== provenance.runAttempt ||
            run.head_sha !== provenance.headSha ||
            run.path !== provenance.workflowPath ||
            run.repository?.full_name !== process.env.GITHUB_REPOSITORY ||
            run.status !== 'completed' ||
            !['cancelled', 'failure', 'timed_out'].includes(run.conclusion) ||
            !/^$|^pkg\/oneworks-desktop\/v[0-9A-Za-z.-]+$/.test(state.releaseTag ?? '') ||
            (requestedReleaseTag && state.releaseTag !== requestedReleaseTag)
          ) {
            throw new Error('Notarization recovery state does not match the requested stage or source contract')
          }
          fs.appendFileSync(outputPath, `build_branch=${state.buildBranch}\n`)
          fs.appendFileSync(outputPath, `build_time=${state.buildTime}\n`)
          fs.appendFileSync(outputPath, `builder_sha=${state.builderSha}\n`)
          fs.appendFileSync(outputPath, `release_tag=${state.releaseTag ?? ''}\n`)
          fs.appendFileSync(outputPath, `source_sha=${state.sourceSha}\n`)
          NODE

      - name: Validate requested product source
        env:
          BUILDER_SOURCE_SHA: ${{ inputs.builder_source_sha }}
          EVENT_NAME: ${{ github.event_name }}
          PRODUCT_SOURCE_SHA: ${{ inputs.product_source_sha }}
          RELEASE_TAG_INPUT: ${{ inputs.release_tag }}
          WORKFLOW_REF: ${{ github.ref }}
          WORKFLOW_SHA: ${{ github.sha }}
        shell: bash
        run: |
          if [[ -z "$PRODUCT_SOURCE_SHA" ]]; then
            exit 0
          fi
          if [[ "$EVENT_NAME" != "workflow_dispatch" ]]; then
            echo "product_source_sha is only supported for manual workflow dispatch." >&2
            exit 1
          fi
          if [[ "$WORKFLOW_REF" != "refs/heads/main" ]]; then
            echo "Immutable product rebuilds must use the protected refs/heads/main workflow." >&2
            exit 1
          fi
          if [[ "$BUILDER_SOURCE_SHA" != "$WORKFLOW_SHA" ]]; then
            echo "Reviewed builder $BUILDER_SOURCE_SHA does not match workflow commit $WORKFLOW_SHA." >&2
            exit 1
          fi
          if [[ "$RELEASE_TAG_INPUT" != ${DESKTOP_RELEASE_TAG_PREFIX}* ]]; then
            echo "A desktop release_tag is required for an immutable product source rebuild." >&2
            exit 1
          fi

          remote_tag_output="$(git ls-remote --exit-code origin "refs/tags/$RELEASE_TAG_INPUT" "refs/tags/$RELEASE_TAG_INPUT^{}")"
          resolved_source_sha="$(
            printf '%s\n' "$remote_tag_output" |
              awk \
                -v direct_ref="refs/tags/$RELEASE_TAG_INPUT" \
                -v peeled_ref="refs/tags/$RELEASE_TAG_INPUT^{}" \
                '$2 == direct_ref { direct_sha = $1 }
                 $2 == peeled_ref { peeled_sha = $1 }
                 END { print (peeled_sha != "" ? peeled_sha : direct_sha) }'
          )"
          if [[ "$resolved_source_sha" != "$PRODUCT_SOURCE_SHA" ]]; then
            echo "Release tag $RELEASE_TAG_INPUT points to $resolved_source_sha, not requested product source $PRODUCT_SOURCE_SHA." >&2
            exit 1
          fi

      - name: Checkout immutable product source
        if: >-
          github.event_name == 'workflow_dispatch' &&
          (inputs.product_source_sha != '' || inputs.notarization_run_id != '')
        uses: actions/checkout@v4
        with:
          path: product-source
          ref: ${{ steps.notarization_recovery.outputs.source_sha || inputs.product_source_sha }}

      - name: Resolve desktop workspace
        id: desktop_workspace
        env:
          NOTARIZATION_SOURCE_SHA: ${{ steps.notarization_recovery.outputs.source_sha }}
          NOTARIZATION_BUILDER_SHA: ${{ steps.notarization_recovery.outputs.builder_sha }}
          NOTARIZATION_STAGE: ${{ inputs.notarization_stage }}
          PRODUCT_SOURCE_SHA: ${{ inputs.product_source_sha }}
        shell: bash
        run: |
          workspace_dir="."
          source_sha="$GITHUB_SHA"
          builder_sha="$GITHUB_SHA"
          if [[ -n "$NOTARIZATION_SOURCE_SHA" ]]; then
            workspace_dir="product-source"
            source_sha="$NOTARIZATION_SOURCE_SHA"
            if [[ "$NOTARIZATION_STAGE" == "installer" ]]; then
              builder_sha="$NOTARIZATION_BUILDER_SHA"
            fi
          elif [[ -n "$PRODUCT_SOURCE_SHA" ]]; then
            workspace_dir="product-source"
            source_sha="$PRODUCT_SOURCE_SHA"
          fi
          echo "builder_sha=$builder_sha" >> "$GITHUB_OUTPUT"
          echo "source_sha=$source_sha" >> "$GITHUB_OUTPUT"
          echo "workspace_dir=$workspace_dir" >> "$GITHUB_OUTPUT"

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11.7.0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
          cache: pnpm

      - name: Install dependencies
        working-directory: ${{ steps.desktop_workspace.outputs.workspace_dir }}
        run: pnpm install --frozen-lockfile

      - name: Run desktop package preflight
        working-directory: ${{ steps.desktop_workspace.outputs.workspace_dir }}
        run: pnpm -C apps/desktop test:package-preflight

      - name: Resolve desktop release metadata
        id: desktop_release
        shell: bash
        env:
          CREATE_RELEASE_REQUESTED: ${{ inputs.create_release || false }}
          DESKTOP_AUTO_UPDATE_REQUESTED: ${{ vars.DESKTOP_AUTO_UPDATE || 'true' }}
          EVENT_NAME: ${{ github.event_name }}
          RELEASE_TAG_INPUT: ${{ inputs.release_tag || steps.notarization_recovery.outputs.release_tag }}
        run: |
          if [[ "$EVENT_NAME" == "workflow_dispatch" && "$CREATE_RELEASE_REQUESTED" == "true" && -z "$RELEASE_TAG_INPUT" ]]; then
            echo "release_tag is required when create_release is enabled manually." >&2
            exit 1
          fi

          tag=""
          if [[ "$GITHUB_REF" == refs/tags/${DESKTOP_RELEASE_TAG_PREFIX}* ]]; then
            tag="$GITHUB_REF_NAME"
          elif [[ "$EVENT_NAME" == "workflow_dispatch" && -n "$RELEASE_TAG_INPUT" ]]; then
            tag="$RELEASE_TAG_INPUT"
          fi

          enabled=false
          auto_update=false
          version=""
          update_channel="stable"
          if [[ -n "$tag" ]]; then
            if [[ "$tag" != ${DESKTOP_RELEASE_TAG_PREFIX}* ]]; then
              echo "Desktop release tags must start with ${DESKTOP_RELEASE_TAG_PREFIX}." >&2
              exit 1
            fi

            version="${tag#${DESKTOP_RELEASE_TAG_PREFIX}}"
            if [[ ! "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+([-.][0-9A-Za-z.-]+)?$ ]]; then
              echo "Desktop release tag must look like ${DESKTOP_RELEASE_TAG_PREFIX}1.2.3 or ${DESKTOP_RELEASE_TAG_PREFIX}1.2.3-beta.1." >&2
              exit 1
            fi
            if [[ "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+-([0-9A-Za-z]+)([.-].*)?$ ]]; then
              update_channel="${BASH_REMATCH[1]}"
              case "$update_channel" in
                alpha|beta|rc) ;;
                *)
                  echo "Desktop prerelease channel must be alpha, beta, or rc." >&2
                  exit 1
                  ;;
              esac
            fi

            enabled=true
            auto_update=true
            case "$DESKTOP_AUTO_UPDATE_REQUESTED" in
              false|0|no|off) auto_update=false ;;
            esac
          fi

          echo "enabled=$enabled" >> "$GITHUB_OUTPUT"
          echo "auto_update=$auto_update" >> "$GITHUB_OUTPUT"
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          echo "update_channel=$update_channel" >> "$GITHUB_OUTPUT"
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - name: Resolve immutable desktop signing policy
        id: desktop_signing_metadata
        env:
          PRODUCT_WORKSPACE: ${{ steps.desktop_workspace.outputs.workspace_dir }}
        run: |
          node - "$PRODUCT_WORKSPACE" "$GITHUB_OUTPUT" <<'NODE'
          const fs = require('node:fs')
          const path = require('node:path')
          const [workspace, outputPath] = process.argv.slice(2)
          const manifest = JSON.parse(
            fs.readFileSync(path.join(workspace, 'apps/desktop/package.json'), 'utf8')
          )
          const policy = manifest.oneworks?.release?.macosSigningPolicy ?? 'auto'
          if (!['auto', 'signed', 'unsigned'].includes(policy)) {
            throw new Error(
              '@oneworks/desktop oneworks.release.macosSigningPolicy must be auto, signed, or unsigned.'
            )
          }
          fs.appendFileSync(outputPath, `policy=${policy}\n`)
          NODE

      - name: Resolve desktop build source metadata
        id: desktop_build_source
        env:
          RECOVERY_BUILD_BRANCH: ${{ steps.notarization_recovery.outputs.build_branch }}
          RECOVERY_BUILD_TIME: ${{ steps.notarization_recovery.outputs.build_time }}
        shell: bash
        run: |
          build_branch="${RECOVERY_BUILD_BRANCH:-${GITHUB_HEAD_REF:-$GITHUB_REF_NAME}}"
          build_time="${RECOVERY_BUILD_TIME:-$(date -u +%Y-%m-%dT%H:%M:%SZ)}"
          echo "branch=$build_branch" >> "$GITHUB_OUTPUT"
          echo "time=$build_time" >> "$GITHUB_OUTPUT"

      - name: Resolve desktop build policy
        id: desktop_build_policy
        shell: bash
        env:
          CREATE_RELEASE_REQUESTED: ${{ inputs.create_release || false }}
          DESKTOP_SIGN_CAPABLE: ${{ vars.DESKTOP_SIGN || 'false' }}
          EVENT_NAME: ${{ github.event_name }}
          MANIFEST_SIGNING_POLICY: ${{ steps.desktop_signing_metadata.outputs.policy }}
          NOTARIZATION_RECOVERY: ${{ inputs.notarization_run_id != '' }}
          RELEASE_CHANNEL: ${{ steps.desktop_release.outputs.update_channel }}
          RELEASE_ENABLED: ${{ steps.desktop_release.outputs.enabled }}
          REQUESTED_SIGNING_POLICY: ${{ inputs.signing_policy || 'auto' }}
        run: |
          archs="arm64,x64"
          effective_policy="unsigned"
          make_targets="dmg,zip,pkg"
          sign=false
          MANIFEST_SIGNING_POLICY="${MANIFEST_SIGNING_POLICY:-auto}"
          REQUESTED_SIGNING_POLICY="${REQUESTED_SIGNING_POLICY:-auto}"

          case "$REQUESTED_SIGNING_POLICY" in
            auto|signed|unsigned) ;;
            *)
              echo "Requested Desktop signing policy must be auto, signed, or unsigned." >&2
              exit 1
              ;;
          esac
          case "$MANIFEST_SIGNING_POLICY" in
            auto|signed|unsigned) ;;
            *)
              echo "Immutable Desktop signing policy must be auto, signed, or unsigned." >&2
              exit 1
              ;;
          esac

          if [[ "$EVENT_NAME" == "schedule" ]]; then
            archs="arm64"
            make_targets="dmg"
          else
            immutable_effective_policy="$MANIFEST_SIGNING_POLICY"
            if [[ "$immutable_effective_policy" == "auto" ]]; then
              if [[ "$RELEASE_ENABLED" != "true" ]]; then
                immutable_effective_policy="unsigned"
              else
                case "$RELEASE_CHANNEL" in
                  alpha|beta) immutable_effective_policy="unsigned" ;;
                  rc|stable) immutable_effective_policy="signed" ;;
                  *)
                    echo "Unsupported Desktop release channel: $RELEASE_CHANNEL." >&2
                    exit 1
                    ;;
                esac
              fi
            fi

            if [[ "$RELEASE_CHANNEL" == "stable" && "$RELEASE_ENABLED" == "true" && ( "$immutable_effective_policy" != "signed" || "$REQUESTED_SIGNING_POLICY" == "unsigned" ) ]]; then
              echo "Stable Desktop releases must be Developer ID signed and Apple-notarized; unsigned is forbidden." >&2
              exit 1
            fi

            if [[ "$RELEASE_ENABLED" == "true" ]]; then
              if [[ "$REQUESTED_SIGNING_POLICY" != "auto" && "$REQUESTED_SIGNING_POLICY" != "$immutable_effective_policy" ]]; then
                echo "Versioned Desktop release signing policy must match the immutable effective package policy." >&2
                exit 1
              fi
              effective_policy="$immutable_effective_policy"
            else
              effective_policy="$REQUESTED_SIGNING_POLICY"
              if [[ "$effective_policy" == "auto" ]]; then
                effective_policy="$immutable_effective_policy"
              fi
            fi

            if [[ "$RELEASE_CHANNEL" == "stable" && "$RELEASE_ENABLED" == "true" && "$effective_policy" != "signed" ]]; then
              echo "Stable Desktop releases must be Developer ID signed and Apple-notarized; unsigned is forbidden." >&2
              exit 1
            fi
            if [[ "$NOTARIZATION_RECOVERY" == "true" && "$effective_policy" != "signed" ]]; then
              echo "Notarization recovery must preserve an effective signed policy." >&2
              exit 1
            fi

            if [[ "$effective_policy" == "signed" ]]; then
              case "$DESKTOP_SIGN_CAPABLE" in
                true|TRUE|1|yes|YES|on|ON) sign=true ;;
                *)
                  echo "Desktop signing is required by the effective policy, but DESKTOP_SIGN capability is disabled." >&2
                  exit 1
                  ;;
              esac
            fi
          fi

          echo "archs=$archs" >> "$GITHUB_OUTPUT"
          echo "effective_policy=$effective_policy" >> "$GITHUB_OUTPUT"
          echo "manifest_policy=$MANIFEST_SIGNING_POLICY" >> "$GITHUB_OUTPUT"
          echo "make_targets=$make_targets" >> "$GITHUB_OUTPUT"
          echo "requested_policy=$REQUESTED_SIGNING_POLICY" >> "$GITHUB_OUTPUT"
          echo "sign=$sign" >> "$GITHUB_OUTPUT"

      - name: Validate recoverable product signing tooling
        if: >-
          steps.desktop_build_policy.outputs.sign == 'true' &&
          steps.desktop_workspace.outputs.workspace_dir != '.'
        env:
          PRODUCT_WORKSPACE: ${{ steps.desktop_workspace.outputs.workspace_dir }}
        run: |
          node - "$PRODUCT_WORKSPACE" <<'NODE'
          const fs = require('node:fs')
          const path = require('node:path')
          const workspace = path.resolve(process.argv[2])
          const read = relativePath => fs.readFileSync(path.join(workspace, relativePath), 'utf8')
          const signing = read('apps/desktop/scripts/mac-signing-options.cjs')
          const installers = read('apps/desktop/scripts/notarize-artifacts.cjs')
          const workspaceConfig = read('pnpm-workspace.yaml')
          const builderConfig = read('apps/desktop/electron-builder.yml')
          const patchPath = path.join(workspace, 'patches', '@electron__osx-sign@2.4.0.patch')
          if (
            signing.includes('osxNotarize') ||
            !installers.includes('ONEWORKS_DESKTOP_DEFER_NOTARIZATION') ||
            !workspaceConfig.includes("'@electron/osx-sign@2.4.0'") ||
            !builderConfig.includes('writeUpdateInfo: false') ||
            !fs.existsSync(patchPath)
          ) {
            throw new Error(
              'Product source predates the recoverable Desktop signing toolchain; cut a new source identity instead of entering blocking notarization.'
            )
          }
          NODE

      - name: Validate desktop signing credentials
        shell: bash
        env:
          APPLE_ID: ${{ steps.desktop_build_policy.outputs.sign == 'true' && secrets.APPLE_ID || '' }}
          APPLE_ID_PASSWORD: ${{ steps.desktop_build_policy.outputs.sign == 'true' && secrets.APPLE_ID_PASSWORD || '' }}
          APPLE_TEAM_ID: ${{ steps.desktop_build_policy.outputs.sign == 'true' && secrets.APPLE_TEAM_ID || '' }}
          DESKTOP_CSC_INSTALLER_KEY_PASSWORD: ${{ steps.desktop_build_policy.outputs.sign == 'true' && secrets.DESKTOP_CSC_INSTALLER_KEY_PASSWORD || '' }}
          DESKTOP_CSC_INSTALLER_LINK: ${{ steps.desktop_build_policy.outputs.sign == 'true' && secrets.DESKTOP_CSC_INSTALLER_LINK || '' }}
          DESKTOP_CSC_KEY_PASSWORD: ${{ steps.desktop_build_policy.outputs.sign == 'true' && secrets.DESKTOP_CSC_KEY_PASSWORD || '' }}
          DESKTOP_CSC_LINK: ${{ steps.desktop_build_policy.outputs.sign == 'true' && secrets.DESKTOP_CSC_LINK || '' }}
          DESKTOP_SIGN: ${{ steps.desktop_build_policy.outputs.sign }}
        run: |
          case "$DESKTOP_SIGN" in
            true|TRUE|1|yes|YES|on|ON) ;;
            *)
              echo "Desktop signing is disabled; release artifacts will be unsigned."
              exit 0
              ;;
          esac

          missing=()
          for name in \
            APPLE_ID \
            APPLE_ID_PASSWORD \
            APPLE_TEAM_ID \
            DESKTOP_CSC_LINK \
            DESKTOP_CSC_KEY_PASSWORD \
            DESKTOP_CSC_INSTALLER_LINK \
            DESKTOP_CSC_INSTALLER_KEY_PASSWORD
          do
            if [[ -z "${!name}" ]]; then
              missing+=("$name")
            fi
          done

          if [[ ${#missing[@]} -gt 0 ]]; then
            echo "Desktop signing is enabled but these secrets are missing: ${missing[*]}" >&2
            exit 1
          fi

      - name: Import desktop application signing identity
        if: steps.desktop_build_policy.outputs.sign == 'true' && inputs.notarization_run_id == ''
        shell: bash
        env:
          DESKTOP_CSC_KEY_PASSWORD: ${{ secrets.DESKTOP_CSC_KEY_PASSWORD }}
          DESKTOP_CSC_LINK: ${{ secrets.DESKTOP_CSC_LINK }}
        run: |
          keychain="$RUNNER_TEMP/oneworks-desktop-signing.keychain-db"
          p12="$RUNNER_TEMP/oneworks-desktop-application.p12"
          probe="$RUNNER_TEMP/oneworks-desktop-signing-probe"
          keychain_password="$(openssl rand -hex 32)"
          trap 'rm -f "$p12" "$probe"' EXIT

          rm -f "$keychain" "$p12" "$probe"
          security create-keychain -p "$keychain_password" "$keychain"
          security set-keychain-settings -lut 21600 "$keychain"
          security unlock-keychain -p "$keychain_password" "$keychain"
          printf '%s' "$DESKTOP_CSC_LINK" | base64 -D > "$p12"
          security import "$p12" \
            -k "$keychain" \
            -P "$DESKTOP_CSC_KEY_PASSWORD" \
            -T /usr/bin/codesign \
            -T /usr/bin/security >/dev/null
          security set-key-partition-list \
            -S apple-tool:,apple:,codesign: \
            -s \
            -k "$keychain_password" \
            "$keychain" >/dev/null
          security list-keychains -d user -s "$keychain"

          identities="$(security find-identity -v -p codesigning "$keychain")"
          identity_count="$(printf '%s\n' "$identities" | awk '/Developer ID Application/ { count += 1 } END { print count + 0 }')"
          if [[ "$identity_count" -ne 1 ]]; then
            echo "Expected exactly one Developer ID Application identity in the temporary keychain." >&2
            exit 1
          fi
          identity_hash="$(printf '%s\n' "$identities" | awk '/Developer ID Application/ { print $2; exit }')"

          cp /usr/bin/true "$probe"
          codesign \
            --sign "$identity_hash" \
            --force \
            --keychain "$keychain" \
            --timestamp \
            --options runtime \
            "$probe" >/dev/null
          codesign --verify --strict "$probe"

          echo "ONEWORKS_DESKTOP_SIGNING_KEYCHAIN=$keychain" >> "$GITHUB_ENV"

      - name: Package desktop app
        if: inputs.notarization_run_id == ''
        working-directory: ${{ steps.desktop_workspace.outputs.workspace_dir }}
        run: pnpm desktop:package
        env:
          APPLE_ID: ${{ steps.desktop_build_policy.outputs.sign == 'true' && secrets.APPLE_ID || '' }}
          APPLE_ID_PASSWORD: ${{ steps.desktop_build_policy.outputs.sign == 'true' && secrets.APPLE_ID_PASSWORD || '' }}
          APPLE_TEAM_ID: ${{ steps.desktop_build_policy.outputs.sign == 'true' && secrets.APPLE_TEAM_ID || '' }}
          ONEWORKS_DESKTOP_ARCHS: ${{ steps.desktop_build_policy.outputs.archs }}
          ONEWORKS_DESKTOP_BUILD_GIT_BRANCH: ${{ steps.desktop_build_source.outputs.branch }}
          ONEWORKS_DESKTOP_BUILD_GIT_HASH: ${{ steps.desktop_workspace.outputs.source_sha }}
          ONEWORKS_DESKTOP_BUILD_TIME: ${{ steps.desktop_build_source.outputs.time }}
          ONEWORKS_DESKTOP_ENABLE_AUTO_UPDATE: ${{ steps.desktop_release.outputs.auto_update }}
          ONEWORKS_DESKTOP_OFFICIAL_RELEASE_BUILD: ${{ steps.desktop_release.outputs.enabled }}
          ONEWORKS_DESKTOP_RELEASE_BUILD: ${{ steps.desktop_release.outputs.enabled }}
          ONEWORKS_DESKTOP_SIGN: ${{ steps.desktop_build_policy.outputs.sign }}
          ONEWORKS_DESKTOP_UPDATE_CHANNEL: ${{ steps.desktop_release.outputs.update_channel }}
          ONEWORKS_DESKTOP_VERSION: ${{ steps.desktop_release.outputs.version }}

      - name: Restore signed app notarization recovery payload
        id: restore_app_notarization
        if: inputs.notarization_run_id != '' && inputs.notarization_stage == 'app'
        working-directory: ${{ steps.desktop_workspace.outputs.workspace_dir }}
        run: >-
          node "$GITHUB_WORKSPACE/apps/desktop/scripts/notarization-state.cjs"
          restore
          --state-dir "$RUNNER_TEMP/oneworks-desktop-notarization-recovery"
          --workspace-dir "$PWD"

      - name: Verify signed apps before notarization
        if: >-
          steps.desktop_build_policy.outputs.sign == 'true' &&
          (inputs.notarization_run_id == '' || inputs.notarization_stage == 'app')
        working-directory: ${{ steps.desktop_workspace.outputs.workspace_dir }}
        run: >-
          node "$GITHUB_WORKSPACE/apps/desktop/scripts/verify-macos-signed-apps.cjs"
          --signature-only
          apps/desktop/out

      - name: Diagnose packaged filesystem authority before notarization
        if: >-
          steps.desktop_build_policy.outputs.sign == 'true' &&
          (inputs.notarization_run_id == '' || inputs.notarization_stage == 'app')
        working-directory: ${{ steps.desktop_workspace.outputs.workspace_dir }}
        run: >-
          node "$GITHUB_WORKSPACE/apps/desktop/scripts/diagnose-packaged-authority.cjs"
          apps/desktop/out
        env:
          ONEWORKS_DESKTOP_OFFICIAL_RELEASE_BUILD: ${{ steps.desktop_release.outputs.enabled }}
          ONEWORKS_DESKTOP_RELEASE_BUILD: ${{ steps.desktop_release.outputs.enabled }}
          ONEWORKS_DESKTOP_SMOKE_ARCH: ${{ runner.os == 'macOS' && 'arm64' || '' }}

      - name: Prepare signed app notarization recovery state
        id: prepare_app_notarization
        if: steps.desktop_build_policy.outputs.sign == 'true' && inputs.notarization_run_id == ''
        working-directory: ${{ steps.desktop_workspace.outputs.workspace_dir }}
        run: >-
          node "$GITHUB_WORKSPACE/apps/desktop/scripts/notarization-state.cjs"
          prepare
          --stage app
          --state-dir "$RUNNER_TEMP/oneworks-desktop-app-notarization"
          --workspace-dir "$PWD"
          --build-branch "${{ steps.desktop_build_source.outputs.branch }}"
          --build-time "${{ steps.desktop_build_source.outputs.time }}"
          --run-id "$GITHUB_RUN_ID"
          --run-attempt "$GITHUB_RUN_ATTEMPT"
          --run-head-sha "$GITHUB_SHA"
          --source-sha "${{ steps.desktop_workspace.outputs.source_sha }}"
          --builder-sha "${{ steps.desktop_workspace.outputs.builder_sha }}"
          --release-tag "${{ steps.desktop_release.outputs.tag }}"

      - name: Submit signed apps for notarization without waiting
        if: steps.desktop_build_policy.outputs.sign == 'true' && inputs.notarization_run_id == ''
        env:
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_ID_PASSWORD: ${{ secrets.APPLE_ID_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: >-
          node apps/desktop/scripts/notarization-state.cjs
          submit
          --state-dir "$RUNNER_TEMP/oneworks-desktop-app-notarization"

      - name: Retain exact signed app notarization recovery state
        if: always() && steps.prepare_app_notarization.outcome == 'success'
        uses: actions/upload-artifact@v4
        with:
          name: desktop-app-notarization-recovery
          path: ${{ runner.temp }}/oneworks-desktop-app-notarization
          if-no-files-found: error
          compression-level: 0
          retention-days: ${{ github.event_name == 'workflow_dispatch' && inputs.retention_days || 14 }}

      - name: Reconcile and submit app notarization recovery state
        id: resume_app_notarization
        if: inputs.notarization_run_id != '' && inputs.notarization_stage == 'app'
        env:
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_ID_PASSWORD: ${{ secrets.APPLE_ID_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          state_dir="$RUNNER_TEMP/oneworks-desktop-notarization-recovery"
          node apps/desktop/scripts/notarization-state.cjs reconcile --state-dir "$state_dir"
          node apps/desktop/scripts/notarization-state.cjs submit --state-dir "$state_dir"

      - name: Bind updated app notarization recovery state to this run
        id: bind_app_notarization
        if: >-
          always() &&
          inputs.notarization_run_id != '' &&
          inputs.notarization_stage == 'app' &&
          steps.restore_app_notarization.outcome == 'success'
        run: >-
          node apps/desktop/scripts/notarization-state.cjs bind
          --state-dir "$RUNNER_TEMP/oneworks-desktop-notarization-recovery"
          --run-id "$GITHUB_RUN_ID"
          --run-attempt "$GITHUB_RUN_ATTEMPT"
          --run-head-sha "$GITHUB_SHA"

      - name: Retain updated app notarization recovery state
        if: >-
          always() &&
          inputs.notarization_run_id != '' &&
          inputs.notarization_stage == 'app' &&
          steps.bind_app_notarization.outcome == 'success'
        uses: actions/upload-artifact@v4
        with:
          name: desktop-app-notarization-recovery
          path: ${{ runner.temp }}/oneworks-desktop-notarization-recovery
          if-no-files-found: error
          compression-level: 0
          retention-days: ${{ inputs.retention_days }}

      - name: Wait for existing app notarization submissions
        if: >-
          steps.desktop_build_policy.outputs.sign == 'true' &&
          (inputs.notarization_run_id == '' || inputs.notarization_stage == 'app')
        env:
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_ID_PASSWORD: ${{ secrets.APPLE_ID_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          NOTARIZATION_RUN_ID: ${{ inputs.notarization_run_id }}
        shell: bash
        run: |
          state_dir="$RUNNER_TEMP/oneworks-desktop-app-notarization"
          if [[ -n "$NOTARIZATION_RUN_ID" ]]; then
            state_dir="$RUNNER_TEMP/oneworks-desktop-notarization-recovery"
          fi
          node apps/desktop/scripts/notarization-state.cjs wait \
            --state-dir "$state_dir" \
            --timeout-minutes 20
          node apps/desktop/scripts/notarization-state.cjs staple \
            --state-dir "$state_dir" \
            --workspace-dir "${{ steps.desktop_workspace.outputs.workspace_dir }}"

      - name: Verify signed and notarized macOS app bundles
        if: steps.desktop_build_policy.outputs.sign == 'true' && inputs.notarization_stage != 'installer'
        working-directory: ${{ steps.desktop_workspace.outputs.workspace_dir }}
        run: node "$GITHUB_WORKSPACE/apps/desktop/scripts/verify-macos-signed-apps.cjs" apps/desktop/out

      - name: Seal immutable unsigned product app bundles
        if: inputs.notarization_run_id == '' && inputs.product_source_sha != '' && steps.desktop_build_policy.outputs.sign != 'true'
        working-directory: ${{ steps.desktop_workspace.outputs.workspace_dir }}
        run: node "$GITHUB_WORKSPACE/apps/desktop/scripts/mac-adhoc-seal.cjs" seal-output apps/desktop/out

      - name: Smoke test packaged server
        if: inputs.notarization_stage != 'installer'
        working-directory: ${{ steps.desktop_workspace.outputs.workspace_dir }}
        run: pnpm -C apps/desktop smoke:package
        env:
          ONEWORKS_DESKTOP_SMOKE_ARCH: ${{ runner.os == 'macOS' && 'arm64' || '' }}
          ONEWORKS_DESKTOP_OFFICIAL_RELEASE_BUILD: ${{ steps.desktop_release.outputs.enabled }}
          ONEWORKS_DESKTOP_RELEASE_BUILD: ${{ steps.desktop_release.outputs.enabled }}

      - name: Restore desktop build dependencies
        if: inputs.notarization_stage != 'installer'
        working-directory: ${{ steps.desktop_workspace.outputs.workspace_dir }}
        run: pnpm install --frozen-lockfile --prod=false

      - name: Build desktop artifacts
        if: inputs.notarization_stage != 'installer'
        working-directory: ${{ steps.desktop_workspace.outputs.workspace_dir }}
        run: pnpm -C apps/desktop make:from-package
        env:
          APPLE_ID: ${{ steps.desktop_build_policy.outputs.sign == 'true' && secrets.APPLE_ID || '' }}
          APPLE_ID_PASSWORD: ${{ steps.desktop_build_policy.outputs.sign == 'true' && secrets.APPLE_ID_PASSWORD || '' }}
          APPLE_TEAM_ID: ${{ steps.desktop_build_policy.outputs.sign == 'true' && secrets.APPLE_TEAM_ID || '' }}
          CSC_INSTALLER_KEY_PASSWORD: ${{ steps.desktop_build_policy.outputs.sign == 'true' && secrets.DESKTOP_CSC_INSTALLER_KEY_PASSWORD || '' }}
          CSC_INSTALLER_LINK: ${{ steps.desktop_build_policy.outputs.sign == 'true' && secrets.DESKTOP_CSC_INSTALLER_LINK || '' }}
          CSC_KEY_PASSWORD: ${{ steps.desktop_build_policy.outputs.sign == 'true' && secrets.DESKTOP_CSC_KEY_PASSWORD || '' }}
          CSC_LINK: ${{ steps.desktop_build_policy.outputs.sign == 'true' && secrets.DESKTOP_CSC_LINK || '' }}
          DEBUG: electron-builder
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          ONEWORKS_DESKTOP_ARCHS: ${{ steps.desktop_build_policy.outputs.archs }}
          ONEWORKS_DESKTOP_DEFER_NOTARIZATION: ${{ steps.desktop_build_policy.outputs.sign }}
          ONEWORKS_DESKTOP_MAKE_TARGETS: ${{ steps.desktop_build_policy.outputs.make_targets }}
          ONEWORKS_DESKTOP_OFFICIAL_RELEASE_BUILD: ${{ steps.desktop_release.outputs.enabled }}
          ONEWORKS_DESKTOP_PUBLISH: never
          ONEWORKS_DESKTOP_RELEASE_BUILD: ${{ steps.desktop_release.outputs.enabled }}
          ONEWORKS_DESKTOP_UPDATE_CHANNEL: ${{ steps.desktop_release.outputs.update_channel }}
          ONEWORKS_DESKTOP_VERSION: ${{ steps.desktop_release.outputs.version }}
          ONEWORKS_DESKTOP_SIGN: ${{ steps.desktop_build_policy.outputs.sign }}

      - name: Restore installer notarization recovery payload
        id: restore_installer_notarization
        if: inputs.notarization_run_id != '' && inputs.notarization_stage == 'installer'
        working-directory: ${{ steps.desktop_workspace.outputs.workspace_dir }}
        run: >-
          node "$GITHUB_WORKSPACE/apps/desktop/scripts/notarization-state.cjs"
          restore
          --state-dir "$RUNNER_TEMP/oneworks-desktop-notarization-recovery"
          --workspace-dir "$PWD"

      - name: Prepare installer notarization recovery state
        id: prepare_installer_notarization
        if: steps.desktop_build_policy.outputs.sign == 'true' && inputs.notarization_stage != 'installer'
        working-directory: ${{ steps.desktop_workspace.outputs.workspace_dir }}
        run: >-
          node "$GITHUB_WORKSPACE/apps/desktop/scripts/notarization-state.cjs"
          prepare
          --stage installer
          --state-dir "$RUNNER_TEMP/oneworks-desktop-installer-notarization"
          --workspace-dir "$PWD"
          --build-branch "${{ steps.desktop_build_source.outputs.branch }}"
          --build-time "${{ steps.desktop_build_source.outputs.time }}"
          --run-id "$GITHUB_RUN_ID"
          --run-attempt "$GITHUB_RUN_ATTEMPT"
          --run-head-sha "$GITHUB_SHA"
          --source-sha "${{ steps.desktop_workspace.outputs.source_sha }}"
          --builder-sha "${{ steps.desktop_workspace.outputs.builder_sha }}"
          --release-tag "${{ steps.desktop_release.outputs.tag }}"

      - name: Submit installers for notarization without waiting
        if: steps.desktop_build_policy.outputs.sign == 'true' && inputs.notarization_stage != 'installer'
        env:
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_ID_PASSWORD: ${{ secrets.APPLE_ID_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: >-
          node apps/desktop/scripts/notarization-state.cjs
          submit
          --state-dir "$RUNNER_TEMP/oneworks-desktop-installer-notarization"

      - name: Retain exact installer notarization recovery state
        if: always() && steps.prepare_installer_notarization.outcome == 'success'
        uses: actions/upload-artifact@v4
        with:
          name: desktop-installer-notarization-recovery
          path: ${{ runner.temp }}/oneworks-desktop-installer-notarization
          if-no-files-found: error
          compression-level: 0
          retention-days: ${{ github.event_name == 'workflow_dispatch' && inputs.retention_days || 14 }}

      - name: Reconcile and submit installer notarization recovery state
        id: resume_installer_notarization
        if: inputs.notarization_run_id != '' && inputs.notarization_stage == 'installer'
        env:
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_ID_PASSWORD: ${{ secrets.APPLE_ID_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          state_dir="$RUNNER_TEMP/oneworks-desktop-notarization-recovery"
          node apps/desktop/scripts/notarization-state.cjs reconcile --state-dir "$state_dir"
          node apps/desktop/scripts/notarization-state.cjs submit --state-dir "$state_dir"

      - name: Bind updated installer notarization recovery state to this run
        id: bind_installer_notarization
        if: >-
          always() &&
          inputs.notarization_run_id != '' &&
          inputs.notarization_stage == 'installer' &&
          steps.restore_installer_notarization.outcome == 'success'
        run: >-
          node apps/desktop/scripts/notarization-state.cjs bind
          --state-dir "$RUNNER_TEMP/oneworks-desktop-notarization-recovery"
          --run-id "$GITHUB_RUN_ID"
          --run-attempt "$GITHUB_RUN_ATTEMPT"
          --run-head-sha "$GITHUB_SHA"

      - name: Retain updated installer notarization recovery state
        if: >-
          always() &&
          inputs.notarization_run_id != '' &&
          inputs.notarization_stage == 'installer' &&
          steps.bind_installer_notarization.outcome == 'success'
        uses: actions/upload-artifact@v4
        with:
          name: desktop-installer-notarization-recovery
          path: ${{ runner.temp }}/oneworks-desktop-notarization-recovery
          if-no-files-found: error
          compression-level: 0
          retention-days: ${{ inputs.retention_days }}

      - name: Wait for existing installer notarization submissions
        if: steps.desktop_build_policy.outputs.sign == 'true'
        env:
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_ID_PASSWORD: ${{ secrets.APPLE_ID_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          NOTARIZATION_STAGE: ${{ inputs.notarization_stage }}
        shell: bash
        run: |
          state_dir="$RUNNER_TEMP/oneworks-desktop-installer-notarization"
          if [[ "$NOTARIZATION_STAGE" == "installer" ]]; then
            state_dir="$RUNNER_TEMP/oneworks-desktop-notarization-recovery"
          fi
          node apps/desktop/scripts/notarization-state.cjs wait \
            --state-dir "$state_dir" \
            --timeout-minutes 20
          node apps/desktop/scripts/notarization-state.cjs staple \
            --state-dir "$state_dir" \
            --workspace-dir "${{ steps.desktop_workspace.outputs.workspace_dir }}"

      - name: Remove temporary desktop signing keychain
        if: always() && steps.desktop_build_policy.outputs.sign == 'true'
        shell: bash
        run: |
          keychain="$RUNNER_TEMP/oneworks-desktop-signing.keychain-db"
          rm -f "$RUNNER_TEMP/oneworks-desktop-application.p12"
          rm -f "$RUNNER_TEMP/oneworks-desktop-signing-probe"
          if [[ -e "$keychain" ]]; then
            security delete-keychain "$keychain"
          fi

      - name: Verify every unsigned macOS artifact seal
        if: steps.desktop_build_policy.outputs.sign != 'true'
        working-directory: ${{ steps.desktop_workspace.outputs.workspace_dir }}
        run: node "$GITHUB_WORKSPACE/apps/desktop/scripts/verify-macos-adhoc-artifacts.cjs" apps/desktop/release
        env:
          ONEWORKS_DESKTOP_ARCHS: ${{ steps.desktop_build_policy.outputs.archs }}
          ONEWORKS_DESKTOP_MAKE_TARGETS: ${{ steps.desktop_build_policy.outputs.make_targets }}
          ONEWORKS_DESKTOP_OFFICIAL_RELEASE_BUILD: ${{ steps.desktop_release.outputs.enabled }}
          ONEWORKS_DESKTOP_RELEASE_BUILD: ${{ steps.desktop_release.outputs.enabled }}
          ONEWORKS_DESKTOP_VERSION: ${{ steps.desktop_release.outputs.version }}

      - name: Verify macOS install artifact
        working-directory: ${{ steps.desktop_workspace.outputs.workspace_dir }}
        run: pnpm -C apps/desktop verify:macos-install
        env:
          ONEWORKS_DESKTOP_BUILD_GIT_BRANCH: ${{ steps.desktop_build_source.outputs.branch }}
          ONEWORKS_DESKTOP_BUILD_GIT_HASH: ${{ steps.desktop_workspace.outputs.source_sha }}
          ONEWORKS_DESKTOP_BUILD_TIME: ${{ steps.desktop_build_source.outputs.time }}
          ONEWORKS_DESKTOP_INSTALL_ARCH: arm64
          ONEWORKS_DESKTOP_OFFICIAL_RELEASE_BUILD: ${{ steps.desktop_release.outputs.enabled }}
          ONEWORKS_DESKTOP_RELEASE_BUILD: ${{ steps.desktop_release.outputs.enabled }}
          ONEWORKS_DESKTOP_SIGN: ${{ steps.desktop_build_policy.outputs.sign }}

      - name: Verify unsigned installed app quarantine boundary
        if: steps.desktop_build_policy.outputs.sign != 'true'
        run: node apps/desktop/scripts/mac-adhoc-seal.cjs verify-quarantine-installed
        env:
          ONEWORKS_DESKTOP_OFFICIAL_RELEASE_BUILD: ${{ steps.desktop_release.outputs.enabled }}
          ONEWORKS_DESKTOP_RELEASE_BUILD: ${{ steps.desktop_release.outputs.enabled }}

      - name: Create release candidate manifest
        if: steps.desktop_release.outputs.enabled == 'true'
        working-directory: ${{ steps.desktop_workspace.outputs.workspace_dir }}
        run: node "$GITHUB_WORKSPACE/apps/desktop/scripts/release-candidate-manifest.cjs" create apps/desktop/release
        env:
          ONEWORKS_DESKTOP_AD_HOC_SEALED: ${{ steps.desktop_build_policy.outputs.sign != 'true' }}
          ONEWORKS_DESKTOP_ARCHS: ${{ steps.desktop_build_policy.outputs.archs }}
          ONEWORKS_DESKTOP_BUILDER_GIT_HASH: ${{ steps.desktop_workspace.outputs.builder_sha }}
          ONEWORKS_DESKTOP_BUILD_GIT_HASH: ${{ steps.desktop_workspace.outputs.source_sha }}
          ONEWORKS_DESKTOP_BUILD_TIME: ${{ steps.desktop_build_source.outputs.time }}
          ONEWORKS_DESKTOP_MAKE_TARGETS: ${{ steps.desktop_build_policy.outputs.make_targets }}
          ONEWORKS_DESKTOP_IMMUTABLE_SIGNING_POLICY: ${{ steps.desktop_build_policy.outputs.manifest_policy }}
          ONEWORKS_DESKTOP_RELEASE_TAG: ${{ steps.desktop_release.outputs.tag }}
          ONEWORKS_DESKTOP_REQUESTED_SIGNING_POLICY: ${{ steps.desktop_build_policy.outputs.requested_policy }}
          ONEWORKS_DESKTOP_SIGNING_POLICY: ${{ steps.desktop_build_policy.outputs.effective_policy }}
          ONEWORKS_DESKTOP_SIGN: ${{ steps.desktop_build_policy.outputs.sign }}

      - name: Upload installer artifacts
        uses: actions/upload-artifact@v4
        with:
          name: oneworks-desktop-macos
          path: |
            ${{ steps.desktop_workspace.outputs.workspace_dir }}/apps/desktop/release/*
          if-no-files-found: error
          retention-days: ${{ github.event_name == 'schedule' && 3 || (github.event_name == 'workflow_dispatch' && inputs.retention_days || 14) }}

  release:
    name: GitHub Release
    needs:
      - dispatch-policy
      - package
    runs-on: ubuntu-latest
    environment: Production
    timeout-minutes: 20
    if: >-
      always() &&
      (startsWith(github.ref, 'refs/tags/pkg/oneworks-desktop/v') ||
        (github.event_name == 'workflow_dispatch' && inputs.create_release)) &&
      (needs.dispatch-policy.result == 'success' || needs.dispatch-policy.result == 'skipped') &&
      (needs.package.result == 'success' ||
        (github.event_name == 'workflow_dispatch' && inputs.candidate_run_id != ''))
    permissions:
      actions: read
      contents: write
    outputs:
      source_sha: ${{ steps.candidate.outputs.source_sha }}
    steps:
      - name: Checkout release tooling
        uses: actions/checkout@v4

      - name: Download installer artifacts
        uses: actions/download-artifact@v4
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          name: oneworks-desktop-macos
          path: release-artifacts
          repository: ${{ github.repository }}
          run-id: ${{ github.event_name == 'workflow_dispatch' && inputs.candidate_run_id || github.run_id }}

      - name: Resolve release tag
        id: release
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          RELEASE_TAG_INPUT: ${{ inputs.release_tag }}
        run: |
          if [ "$EVENT_NAME" = "workflow_dispatch" ]; then
            tag="$RELEASE_TAG_INPUT"
            if [ -z "$tag" ]; then
              echo "release_tag is required when create_release is enabled manually." >&2
              exit 1
            fi
          else
            tag="${GITHUB_REF_NAME}"
          fi

          case "$tag" in
            pkg/oneworks-desktop/v*) ;;
            *)
              echo "Desktop release tags must start with pkg/oneworks-desktop/v." >&2
              exit 1
              ;;
          esac

          version="${tag#pkg/oneworks-desktop/v}"
          if ! [[ "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+([-.][0-9A-Za-z.-]+)?$ ]]; then
            echo "Desktop release tag must look like pkg/oneworks-desktop/v1.2.3 or pkg/oneworks-desktop/v1.2.3-beta.1." >&2
            exit 1
          fi
          update_channel="stable"
          if [[ "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+-([0-9A-Za-z]+)([.-].*)?$ ]]; then
            update_channel="${BASH_REMATCH[1]}"
            case "$update_channel" in
              alpha|beta|rc) ;;
              *)
                echo "Desktop prerelease channel must be alpha, beta, or rc." >&2
                exit 1
                ;;
            esac
          fi

          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          echo "update_channel=$update_channel" >> "$GITHUB_OUTPUT"

      - name: Verify release candidate
        id: candidate
        run: node apps/desktop/scripts/release-candidate-manifest.cjs verify release-artifacts
        env:
          ONEWORKS_DESKTOP_EXPECTED_ARCHS: arm64,x64
          ONEWORKS_DESKTOP_ENFORCE_IMMUTABLE_SIGNING_POLICY: "true"
          ONEWORKS_DESKTOP_EXPECTED_MAKE_TARGETS: dmg,zip,pkg
          ONEWORKS_DESKTOP_EXPECTED_SIGNING_POLICY: ${{ inputs.signing_policy || 'auto' }}
          ONEWORKS_DESKTOP_RELEASE_TAG: ${{ steps.release.outputs.tag }}

      - name: Verify immutable signing policy source
        env:
          CANDIDATE_IMMUTABLE_SIGNING_POLICY: ${{ steps.candidate.outputs.immutable_signing_policy }}
          SOURCE_SHA: ${{ steps.candidate.outputs.source_sha }}
        shell: bash
        run: |
          set -euo pipefail
          git fetch --no-tags --depth=1 origin "$SOURCE_SHA"
          actual_policy="$({
            git show "$SOURCE_SHA:apps/desktop/package.json" |
              node -e '
                let source = ""
                process.stdin.setEncoding("utf8")
                process.stdin.on("data", chunk => { source += chunk })
                process.stdin.on("end", () => {
                  const manifest = JSON.parse(source)
                  const policy = manifest.oneworks?.release?.macosSigningPolicy ?? "auto"
                  if (!["auto", "signed", "unsigned"].includes(policy)) process.exit(1)
                  process.stdout.write(policy)
                })
              '
          })"
          if [[ "$actual_policy" != "$CANDIDATE_IMMUTABLE_SIGNING_POLICY" ]]; then
            echo "Desktop candidate immutable signing policy does not match its product source." >&2
            exit 1
          fi

      - name: Enforce complete unsigned bundle sealing
        env:
          AD_HOC_SEALED: ${{ steps.candidate.outputs.ad_hoc_sealed }}
          BUILDER_SHA: ${{ steps.candidate.outputs.builder_sha }}
          EFFECTIVE_SIGNING_POLICY: ${{ steps.candidate.outputs.effective_signing_policy }}
          EXPECTED_BUILDER_SHA: ${{ inputs.builder_source_sha }}
          EXPECTED_PRODUCT_SHA: ${{ inputs.product_source_sha }}
          REPLACE_EXISTING_RELEASE: ${{ inputs.replace_existing_release }}
          SIGNED: ${{ steps.candidate.outputs.signed }}
          SOURCE_SHA: ${{ steps.candidate.outputs.source_sha }}
          WORKFLOW_REF: ${{ github.ref }}
          WORKFLOW_SHA: ${{ github.sha }}
        shell: bash
        run: |
          if [[ "$SIGNED" != "true" && "$AD_HOC_SEALED" != "true" ]]; then
            echo "Unsigned desktop release candidates must contain a complete ad-hoc bundle seal." >&2
            exit 1
          fi
          if [[ "$SIGNED" == "true" && "$EFFECTIVE_SIGNING_POLICY" != "signed" ]] || [[ "$SIGNED" != "true" && "$EFFECTIVE_SIGNING_POLICY" != "unsigned" ]]; then
            echo "Desktop release candidate signing bytes do not match the effective signing policy." >&2
            exit 1
          fi
          if [[ "$REPLACE_EXISTING_RELEASE" == "true" ]]; then
            if [[ "$WORKFLOW_REF" != "refs/heads/main" || "$WORKFLOW_SHA" != "$EXPECTED_BUILDER_SHA" ]]; then
              echo "Existing release replacement must run from the exact reviewed protected-main builder." >&2
              exit 1
            fi
            if [[ "$BUILDER_SHA" != "$EXPECTED_BUILDER_SHA" || "$SOURCE_SHA" != "$EXPECTED_PRODUCT_SHA" ]]; then
              echo "Release candidate product or builder identity does not match the replacement request." >&2
              exit 1
            fi
          fi

      - name: Verify release tag source
        env:
          SOURCE_SHA: ${{ steps.candidate.outputs.source_sha }}
          TAG: ${{ steps.candidate.outputs.tag }}
        shell: bash
        run: |
          if remote_tag_output="$(git ls-remote --exit-code origin "refs/tags/$TAG" "refs/tags/$TAG^{}")"; then
            resolved_source_sha="$(
              printf '%s\n' "$remote_tag_output" |
                awk \
                  -v direct_ref="refs/tags/$TAG" \
                  -v peeled_ref="refs/tags/$TAG^{}" \
                  '$2 == direct_ref { direct_sha = $1 }
                   $2 == peeled_ref { peeled_sha = $1 }
                   END { print (peeled_sha != "" ? peeled_sha : direct_sha) }'
            )"
            if [[ -z "$resolved_source_sha" ]]; then
              echo "Release tag $TAG exists but its commit could not be resolved." >&2
              exit 1
            fi
            if [[ "$resolved_source_sha" != "$SOURCE_SHA" ]]; then
              echo "Release tag $TAG points to $resolved_source_sha, not verified candidate $SOURCE_SHA." >&2
              exit 1
            fi
          else
            lookup_status=$?
            if [[ "$lookup_status" -ne 2 ]]; then
              echo "Unable to query release tag $TAG (git ls-remote status $lookup_status)." >&2
              exit 1
            fi
            echo "Release tag $TAG does not exist yet; GitHub Release will create it at $SOURCE_SHA."
          fi

      - name: Resolve existing release state
        id: release_state
        env:
          GH_REPO: ${{ github.repository }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPLACE_EXISTING_RELEASE: ${{ inputs.replace_existing_release }}
          TAG: ${{ steps.candidate.outputs.tag }}
        shell: bash
        run: |
          existing=false
          if gh release view "$TAG" >/dev/null 2>&1; then
            existing=true
            if [[ "$REPLACE_EXISTING_RELEASE" != "true" ]]; then
              echo "Release $TAG already exists; set replace_existing_release=true for an explicit recoverable replacement." >&2
              exit 1
            fi
          elif [[ "$REPLACE_EXISTING_RELEASE" == "true" ]]; then
            echo "replace_existing_release was requested, but Release $TAG does not exist." >&2
            exit 1
          fi
          echo "existing=$existing" >> "$GITHUB_OUTPUT"

      - name: Archive existing release assets
        if: steps.release_state.outputs.existing == 'true'
        env:
          GH_REPO: ${{ github.repository }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ steps.candidate.outputs.tag }}
        shell: bash
        run: |
          set -euo pipefail
          mkdir release-backup
          gh release download "$TAG" --dir release-backup
          find release-artifacts -maxdepth 1 -type f -exec basename {} \; | LC_ALL=C sort > candidate-assets.txt
          find release-backup -maxdepth 1 -type f -exec basename {} \; | LC_ALL=C sort > existing-assets.txt
          if ! diff -u existing-assets.txt candidate-assets.txt; then
            echo "Replacement candidate and existing Release asset name sets differ." >&2
            exit 1
          fi
          (
            cd release-backup
            sha256sum * | LC_ALL=C sort
          ) > release-backup-sha256.txt

      - name: Retain existing release backup
        if: steps.release_state.outputs.existing == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: oneworks-desktop-existing-release-backup
          path: |
            release-backup/*
            release-backup-sha256.txt
          if-no-files-found: error
          retention-days: 90

      - name: Resolve release notes
        id: release_notes
        env:
          AD_HOC_SEALED: ${{ steps.candidate.outputs.ad_hoc_sealed }}
          BUILDER_SHA: ${{ steps.candidate.outputs.builder_sha }}
          EFFECTIVE_SIGNING_POLICY: ${{ steps.candidate.outputs.effective_signing_policy }}
          REPLACE_EXISTING_RELEASE: ${{ inputs.replace_existing_release }}
          SIGNED: ${{ steps.candidate.outputs.signed }}
          SOURCE_SHA: ${{ steps.candidate.outputs.source_sha }}
          TAG: ${{ steps.candidate.outputs.tag }}
        shell: bash
        run: |
          if [[ "$SIGNED" == "true" ]]; then
            signing_note="- Developer ID signed and Apple-notarized macOS installers"
          elif [[ "$AD_HOC_SEALED" == "true" ]]; then
            signing_note="- Unsigned macOS installers with a complete ad-hoc bundle seal; no Apple notarization was requested, and Gatekeeper still requires manual approval"
          else
            signing_note="- Unsigned macOS installers; Gatekeeper may require manual approval"
          fi
          release_version="${TAG#pkg/oneworks-desktop/v}"

          {
            echo "notes<<EOF"
            echo "One Works desktop release ${TAG}"
            echo
            echo "$signing_note"
            echo "- Effective macOS signing policy: $EFFECTIVE_SIGNING_POLICY"
            echo "- Intel (x64) and Apple Silicon (arm64): .dmg, .pkg, .zip"
            echo "- Product source: $SOURCE_SHA"
            echo "- Release builder: $BUILDER_SHA"
            if [[ "$REPLACE_EXISTING_RELEASE" == "true" ]]; then
              echo "- Existing $release_version users must re-download the installer because same-version assets do not auto-update"
            fi
            echo "EOF"
          } >> "$GITHUB_OUTPUT"

      - name: Create or update GitHub Release
        env:
          EXISTING_RELEASE: ${{ steps.release_state.outputs.existing }}
          GH_REPO: ${{ github.repository }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          NOTES: ${{ steps.release_notes.outputs.notes }}
          SOURCE_SHA: ${{ steps.candidate.outputs.source_sha }}
          TAG: ${{ steps.candidate.outputs.tag }}
          UPDATE_CHANNEL: ${{ steps.candidate.outputs.update_channel }}
        shell: bash
        run: |
          set -euo pipefail

          verify_remote_directory() {
            local directory="$1"
            local expected_count=0
            declare -A remote_digest=()
            declare -A remote_size=()
            while IFS=$'\t' read -r name size digest; do
              [[ -n "$name" ]] || continue
              remote_digest["$name"]="$digest"
              remote_size["$name"]="$size"
            done < <(
              gh release view "$TAG" --json assets \
                --jq '.assets[] | [.name, (.size | tostring), (.digest // "")] | @tsv'
            )

            while IFS= read -r -d '' file; do
              expected_count=$((expected_count + 1))
              local local_sha
              local local_size
              local name
              local_sha="$(sha256sum "$file" | awk '{ print $1 }')"
              local_size="$(stat -c %s "$file")"
              name="$(basename "$file")"
              if [[ "${remote_size[$name]:-}" != "$local_size" ]]; then
                echo "Remote size mismatch for $name." >&2
                return 1
              fi
              if [[ "${remote_digest[$name]:-}" != "sha256:$local_sha" ]]; then
                echo "Remote SHA-256 mismatch for $name." >&2
                return 1
              fi
            done < <(find "$directory" -maxdepth 1 -type f -print0)

            if [[ "$expected_count" -ne "${#remote_size[@]}" ]]; then
              echo "Remote Release asset count does not match $directory." >&2
              return 1
            fi
          }

          upload_directory() {
            local directory="$1"
            local files=()
            mapfile -d '' files < <(find "$directory" -maxdepth 1 -type f -print0)
            if [[ "${#files[@]}" -eq 0 ]]; then
              echo "No files found in $directory." >&2
              return 1
            fi
            gh release upload "$TAG" "${files[@]}" --clobber
          }

          restore_existing_release() {
            local failure_status=$?
            trap - ERR
            echo "Replacement failed; restoring archived Release assets." >&2
            upload_directory release-backup
            verify_remote_directory release-backup
            exit "$failure_status"
          }

          delete_incomplete_new_release() {
            local failure_status=$?
            trap - ERR
            echo "Publication failed; deleting incomplete new Release without moving the tag." >&2
            gh release delete "$TAG" --yes
            exit "$failure_status"
          }

          if [[ "$EXISTING_RELEASE" == "true" ]]; then
            trap restore_existing_release ERR
          else
            if [[ "$UPDATE_CHANNEL" == "stable" ]]; then
              gh release create "$TAG" --target "$SOURCE_SHA" --title "$TAG" \
                --notes "Publication verification in progress." --latest
            else
              gh release create "$TAG" --target "$SOURCE_SHA" --title "$TAG" \
                --notes "Publication verification in progress." --prerelease --latest=false
            fi
            trap delete_incomplete_new_release ERR
          fi

          upload_directory release-artifacts
          verify_remote_directory release-artifacts

          if [[ "$UPDATE_CHANNEL" == "stable" ]]; then
            gh release edit "$TAG" --latest --notes "$NOTES"
          else
            gh release edit "$TAG" --prerelease --notes "$NOTES"
          fi
          trap - ERR

  homepage:
    name: Publish Homepage
    needs: release
    if: needs.release.result == 'success'
    uses: ./.github/workflows/deploy-homepage.yml
    with:
      source_sha: ${{ needs.release.outputs.source_sha }}
    secrets:
      HOMEPAGE_DEPLOY_TOKEN: ${{ secrets.HOMEPAGE_DEPLOY_TOKEN }}
