name: Relay Server Deploy
on:
  workflow_dispatch:
    inputs:
      source_sha:
        description: Immutable origin/main commit SHA approved for production.
        required: true
        type: string
run-name: Deploy Relay production ${{ inputs.source_sha }}
permissions:
  contents: read
env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"
  WRANGLER_VERSION: 4.49.0
concurrency:
  group: relay-server-deploy-${{ github.ref }}
  cancel-in-progress: false
jobs:
  deploy:
    name: deploy-relay-server
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11.7.0
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
          cache: pnpm
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Validate immutable production source
        env:
          APPROVED_SOURCE_SHA: ${{ inputs.source_sha }}
          CHECKED_OUT_REF: ${{ github.ref }}
          CHECKED_OUT_SOURCE_SHA: ${{ github.sha }}
        shell: bash
        run: |
          set -euo pipefail
          if [ "${CHECKED_OUT_REF}" != "refs/heads/main" ]; then
            echo "::error::Relay production promotion must run from the main branch, got ${CHECKED_OUT_REF}."
            exit 1
          fi
          if [ "${APPROVED_SOURCE_SHA}" != "${CHECKED_OUT_SOURCE_SHA}" ]; then
            echo "::error::Approved source SHA ${APPROVED_SOURCE_SHA} does not match checked out main SHA ${CHECKED_OUT_SOURCE_SHA}."
            exit 1
          fi
      - name: Build Relay server deployment artifact
        run: pnpm -C apps/relay-server build:vercel
      - name: Run Relay live smoke against built Admin assets
        run: pnpm tools relay-config live-smoke --json --skip-admin-build
      - name: Upload Relay server artifact
        uses: actions/upload-artifact@v4
        with:
          name: relay-server-vercel-artifact
          path: |
            apps/relay-server/dist
            apps/relay-server/public
          if-no-files-found: error
      - name: Resolve production deployment target
        id: deployment-target
        env:
          GH_TOKEN: ${{ secrets.RELAY_SERVER_DEPLOY_TOKEN }}
          RELAY_SERVER_DEPLOY_REPOSITORY: ${{ vars.RELAY_SERVER_DEPLOY_REPOSITORY }}
          RELAY_SERVER_DEPLOY_WORKFLOW: ${{ vars.RELAY_SERVER_DEPLOY_WORKFLOW }}
        shell: bash
        run: |
          set -euo pipefail
          configured=0
          [ -n "${GH_TOKEN}" ] && configured=$((configured + 1))
          [ -n "${RELAY_SERVER_DEPLOY_REPOSITORY}" ] && configured=$((configured + 1))
          [ -n "${RELAY_SERVER_DEPLOY_WORKFLOW}" ] && configured=$((configured + 1))
          if [ "$configured" -eq 0 ]; then
            echo "external=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if [ "$configured" -eq 3 ]; then
            echo "external=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          echo "::error::External Relay deployment must configure token, repository, and workflow together."
          exit 1
      - name: Trigger external Relay server deployment
        if: steps.deployment-target.outputs.external == 'true'
        env:
          GH_TOKEN: ${{ secrets.RELAY_SERVER_DEPLOY_TOKEN }}
          RELAY_SERVER_DEPLOY_REPOSITORY: ${{ vars.RELAY_SERVER_DEPLOY_REPOSITORY }}
          RELAY_SERVER_DEPLOY_WORKFLOW: ${{ vars.RELAY_SERVER_DEPLOY_WORKFLOW }}
          SOURCE_REF: main
          SOURCE_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          run_url="$(gh workflow run "${RELAY_SERVER_DEPLOY_WORKFLOW}" \
            --repo "${RELAY_SERVER_DEPLOY_REPOSITORY}" \
            --ref main \
            -f source_ref="${SOURCE_REF}" \
            -f source_sha="${SOURCE_SHA}")"
          echo "$run_url"
          run_id="${run_url##*/}"
          if [ -z "$run_id" ] || [ "$run_id" = "$run_url" ]; then
            echo "Unable to resolve Relay server workflow run id from: $run_url" >&2
            exit 1
          fi
          gh run watch "$run_id" \
            --repo "${RELAY_SERVER_DEPLOY_REPOSITORY}" \
            --exit-status \
            --interval 10
      - name: Validate Cloudflare production credentials
        id: cloudflare-credentials
        if: steps.deployment-target.outputs.external != 'true'
        env:
          PROD_API_TOKEN: ${{ secrets.RELAY_PROD_CLOUDFLARE_API_TOKEN }}
          PROD_ACCOUNT_ID: ${{ secrets.RELAY_PROD_CLOUDFLARE_ACCOUNT_ID }}
          DEV_API_TOKEN: ${{ secrets.RELAY_DEV_CLOUDFLARE_API_TOKEN }}
          DEV_ACCOUNT_ID: ${{ secrets.RELAY_DEV_CLOUDFLARE_ACCOUNT_ID }}
        shell: bash
        run: |
          set -euo pipefail
          prod_configured=0
          [ -n "${PROD_API_TOKEN}" ] && prod_configured=$((prod_configured + 1))
          [ -n "${PROD_ACCOUNT_ID}" ] && prod_configured=$((prod_configured + 1))
          if [ "$prod_configured" -eq 1 ]; then
            echo "::error::Cloudflare production token and account id must be configured together."
            exit 1
          fi
          if [ "$prod_configured" -eq 2 ]; then
            echo "source=prod" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          dev_configured=0
          [ -n "${DEV_API_TOKEN}" ] && dev_configured=$((dev_configured + 1))
          [ -n "${DEV_ACCOUNT_ID}" ] && dev_configured=$((dev_configured + 1))
          if [ "$dev_configured" -eq 2 ]; then
            echo "::notice::Using the migration fallback Cloudflare credential pair for this production promotion."
            echo "source=dev" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          echo "::error::Configure an atomic Cloudflare production credential pair; the migration fallback is also incomplete."
          exit 1
      - name: Deploy Relay Worker to Cloudflare production
        if: steps.deployment-target.outputs.external != 'true'
        env:
          CLOUDFLARE_API_TOKEN: ${{ steps.cloudflare-credentials.outputs.source == 'prod' && secrets.RELAY_PROD_CLOUDFLARE_API_TOKEN || secrets.RELAY_DEV_CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ steps.cloudflare-credentials.outputs.source == 'prod' && secrets.RELAY_PROD_CLOUDFLARE_ACCOUNT_ID || secrets.RELAY_DEV_CLOUDFLARE_ACCOUNT_ID }}
          RELAY_PROD_CF_WORKER_NAME: ${{ vars.RELAY_PROD_CF_WORKER_NAME }}
        shell: bash
        run: |
          set -euo pipefail
          worker_name="${RELAY_PROD_CF_WORKER_NAME:-oneworks-relay-server}"
          pnpm dlx "wrangler@${WRANGLER_VERSION}" deploy \
            --config apps/relay-server/wrangler.jsonc \
            --name "$worker_name" \
            --keep-vars \
            --var "ONEWORKS_RELAY_BUILD_SHA:${GITHUB_SHA}"
      - name: Deploy Relay Admin to Cloudflare production
        if: steps.deployment-target.outputs.external != 'true'
        working-directory: apps/relay-admin
        env:
          CLOUDFLARE_API_TOKEN: ${{ steps.cloudflare-credentials.outputs.source == 'prod' && secrets.RELAY_PROD_CLOUDFLARE_API_TOKEN || secrets.RELAY_DEV_CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ steps.cloudflare-credentials.outputs.source == 'prod' && secrets.RELAY_PROD_CLOUDFLARE_ACCOUNT_ID || secrets.RELAY_DEV_CLOUDFLARE_ACCOUNT_ID }}
          RELAY_PROD_CF_PAGES_PROJECT: ${{ vars.RELAY_PROD_CF_PAGES_PROJECT }}
        shell: bash
        run: |
          set -euo pipefail
          pages_project="${RELAY_PROD_CF_PAGES_PROJECT:-oneworks}"
          pnpm dlx "wrangler@${WRANGLER_VERSION}" pages deploy dist \
            --project-name "$pages_project" \
            --branch main \
            --commit-hash "${GITHUB_SHA}" \
            --commit-message "Deploy Relay production ${GITHUB_SHA}"
      - name: Smoke check Relay production
        env:
          RELAY_PROD_ORIGIN: ${{ vars.RELAY_PROD_ORIGIN }}
          RELAY_PROD_CF_ORIGIN: ${{ vars.RELAY_PROD_CF_ORIGIN }}
          RELAY_PROD_EXPECTED_SSO_PROVIDERS: ${{ vars.RELAY_PROD_EXPECTED_SSO_PROVIDERS }}
        shell: bash
        run: |
          set -euo pipefail
          origin="${RELAY_PROD_ORIGIN:-${RELAY_PROD_CF_ORIGIN:-https://cf.oneworks.cloud}}"
          version="$(node -p "require('./apps/relay-server/package.json').version")"
          for attempt in $(seq 1 30); do
            echo "Production smoke attempt ${attempt}/30 against ${origin}"
            if RELAY_ORIGIN="$origin" \
              RELAY_EXPECTED_BUILD_SHA="${GITHUB_SHA}" \
              RELAY_EXPECTED_VERSION="$version" \
              RELAY_EXPECTED_SSO_PROVIDERS="${RELAY_PROD_EXPECTED_SSO_PROVIDERS:-}" \
              node .github/workflows/scripts/relay-dev-smoke.mjs; then
              exit 0
            fi
            sleep 20
          done
          echo "::error::Cloudflare production did not become healthy at ${origin} within 10 minutes."
          exit 1
