name: Relay Server Deploy

on:
  workflow_dispatch:
    inputs:
      platform:
        description: Production target to promote.
        required: true
        default: both
        type: choice
        options:
          - both
          - cloudflare
          - vercel
          - external
      source_sha:
        description: Immutable origin/main commit SHA approved for production.
        required: true
        type: string

run-name: Deploy Relay production ${{ inputs.platform }} ${{ inputs.source_sha }}

permissions:
  contents: read

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"
  WRANGLER_VERSION: 4.49.0
  VERCEL_VERSION: 58.4.4

concurrency:
  group: relay-server-production-global
  cancel-in-progress: false

jobs:
  validate-source:
    name: validate-source
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Validate immutable production source
        env:
          APPROVED_SOURCE_SHA: ${{ inputs.source_sha }}
          CHECKED_OUT_REF: ${{ github.ref }}
          CHECKED_OUT_SOURCE_SHA: ${{ github.sha }}
        shell: bash
        run: |
          set -euo pipefail
          if [ "${CHECKED_OUT_REF}" != "refs/heads/main" ]; then echo "::error::Relay production promotion must run from the main branch, got ${CHECKED_OUT_REF}."; exit 1; fi
          if [ "${APPROVED_SOURCE_SHA}" != "${CHECKED_OUT_SOURCE_SHA}" ]; then echo "::error::Approved source SHA ${APPROVED_SOURCE_SHA} does not match checked out main SHA ${CHECKED_OUT_SOURCE_SHA}."; exit 1; fi

  deploy-cloudflare:
    name: cloudflare-production
    needs: validate-source
    if: inputs.platform == 'both' || inputs.platform == 'cloudflare'
    runs-on: ubuntu-latest
    environment: Production
    timeout-minutes: 40
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.RELAY_PROD_CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.RELAY_PROD_CLOUDFLARE_ACCOUNT_ID }}
      RELAY_PROD_CF_DEVICE_API_ORIGIN: ${{ vars.RELAY_PROD_CF_DEVICE_API_ORIGIN || 'https://oneworks-relay-server.oneworks.workers.dev' }}
      RELAY_PROD_CF_ORIGIN: ${{ vars.RELAY_PROD_CF_ORIGIN || 'https://cf.oneworks.cloud' }}
      RELAY_PROD_CF_PAGES_PROJECT: ${{ vars.RELAY_PROD_CF_PAGES_PROJECT }}
      RELAY_PROD_CF_WORKER_NAME: ${{ vars.RELAY_PROD_CF_WORKER_NAME }}
      RELAY_PROD_EXPECTED_SSO_PROVIDERS: ${{ vars.RELAY_PROD_EXPECTED_SSO_PROVIDERS }}
    steps:
      - name: Require atomic Cloudflare production credentials
        shell: bash
        run: |
          set -euo pipefail
          if [ -z "${CLOUDFLARE_API_TOKEN}" ] || [ -z "${CLOUDFLARE_ACCOUNT_ID}" ]; then
            echo "::error::Configure RELAY_PROD_CLOUDFLARE_API_TOKEN and RELAY_PROD_CLOUDFLARE_ACCOUNT_ID together."
            exit 1
          fi
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11.7.0
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
          cache: pnpm
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Build shared types artifact
        run: pnpm -C packages/types build
      - name: Build shared icon artifact
        run: pnpm -C packages/icon build
      - name: Build Relay Admin Pages artifact
        run: pnpm -C apps/relay-admin build:platform
      - name: Deploy Relay Worker to Cloudflare production
        shell: bash
        run: |
          set -euo pipefail
          worker_name="${RELAY_PROD_CF_WORKER_NAME:-oneworks-relay-server}"
          pnpm dlx "wrangler@${WRANGLER_VERSION}" deploy \
            --config apps/relay-server/wrangler.jsonc \
            --name "$worker_name" \
            --keep-vars \
            --var "ONEWORKS_RELAY_BUILD_SHA:${GITHUB_SHA}" \
            --var "ONEWORKS_RELAY_DEVICE_API_URL:${RELAY_PROD_CF_DEVICE_API_ORIGIN}" \
            --var "ONEWORKS_RELAY_DEVICE_CONTROL_WS_URL:${RELAY_PROD_CF_DEVICE_API_ORIGIN/https:/wss:}/api/relay/devices/control" \
            --var "ONEWORKS_RELAY_DEVICE_CONTROL_HEARTBEAT_SECONDS:600" \
            --var "ONEWORKS_RELAY_DEVICE_ONLINE_TTL_SECONDS:900"
      - name: Deploy Relay Admin to Cloudflare production
        working-directory: apps/relay-admin
        shell: bash
        run: |
          set -euo pipefail
          pages_project="${RELAY_PROD_CF_PAGES_PROJECT:-oneworks}"
          pnpm dlx "wrangler@${WRANGLER_VERSION}" pages deploy dist \
            --project-name "$pages_project" \
            --branch main \
            --commit-hash "${GITHUB_SHA}" \
            --commit-message "Deploy Relay production ${GITHUB_SHA}"
      - name: Smoke check Relay Cloudflare production
        env:
          RELAY_SMOKE_READY_ATTEMPTS: 30
        shell: bash
        run: |
          set -euo pipefail
          version="$(node -p "require('./apps/relay-server/package.json').version")"
          RELAY_ORIGIN="${RELAY_PROD_CF_ORIGIN}" \
            RELAY_EXPECTED_BUILD_SHA="${GITHUB_SHA}" \
            RELAY_EXPECTED_VERSION="$version" \
            RELAY_EXPECTED_DEVICE_API_ORIGIN="${RELAY_PROD_CF_DEVICE_API_ORIGIN}" \
            RELAY_EXPECTED_TRANSPORT=v1-websocket \
            RELAY_EXPECTED_TRANSPORT_HEARTBEAT_MS=600000 \
            RELAY_EXPECTED_SSO_PROVIDERS="${RELAY_PROD_EXPECTED_SSO_PROVIDERS:-}" \
            node .github/workflows/scripts/relay-dev-smoke.mjs
  deploy-vercel:
    name: vercel-production
    needs: validate-source
    if: inputs.platform == 'both' || inputs.platform == 'vercel'
    runs-on: ubuntu-latest
    environment: Production
    timeout-minutes: 40
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11.7.0
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
          cache: pnpm
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Deploy Relay and Admin to Vercel production
        env:
          PROD_TOKEN: ${{ secrets.RELAY_PROD_VERCEL_TOKEN }}
          PROD_ORG_ID: ${{ secrets.RELAY_PROD_VERCEL_ORG_ID }}
          PROD_PROJECT_ID: ${{ secrets.RELAY_PROD_VERCEL_PROJECT_ID }}
          EXPLICIT_PROJECT_ID: ${{ vars.RELAY_PROD_VERCEL_PROJECT_ID }}
          RELAY_PROD_VC_ORIGIN: ${{ vars.RELAY_PROD_VC_ORIGIN }}
          RELAY_PROD_EXPECTED_SSO_PROVIDERS: ${{ vars.RELAY_PROD_EXPECTED_SSO_PROVIDERS }}
        run: node .github/workflows/scripts/relay-vercel-production.mjs
  deploy-external:
    name: external-production
    needs: validate-source
    if: inputs.platform == 'external'
    runs-on: ubuntu-latest
    environment: Production
    timeout-minutes: 40
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Trigger external Relay server deployment
        env:
          GH_TOKEN: ${{ secrets.RELAY_SERVER_DEPLOY_TOKEN }}
          RELAY_SERVER_DEPLOY_REPOSITORY: ${{ vars.RELAY_SERVER_DEPLOY_REPOSITORY }}
          RELAY_SERVER_DEPLOY_WORKFLOW: ${{ vars.RELAY_SERVER_DEPLOY_WORKFLOW }}
        run: node .github/workflows/scripts/relay-external-production.mjs
