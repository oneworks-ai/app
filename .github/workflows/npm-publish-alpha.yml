# eslint-disable max-lines -- publish sequencing must remain visibly fail-closed.
name: npm Publish
on:
  workflow_dispatch:
    inputs:
      dry_run:
        default: false
        description: Run publish-plan with --dry-run instead of publishing.
        required: false
        type: boolean
      packages:
        description: Comma-separated package names. Leave empty only when publish_all is true.
        required: false
        type: string
      publish_all:
        default: false
        description: Publish the full public workspace plan when packages is empty.
        required: false
        type: boolean
      publish_tag:
        default: alpha
        description: npm dist-tag used when publishing. Use latest for the bootstrap redirect package group when bare npx should resolve to it.
        required: false
        type: string
      auth_mode:
        default: oidc
        description: oidc (default), new-identity-bootstrap, or missing-trust-recovery. Target releases require oidc provenance.
        required: false
        type: choice
        options:
          - oidc
          - new-identity-bootstrap
          - missing-trust-recovery
permissions:
  attestations: write
  contents: write
  id-token: write
env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"
concurrency:
  group: npm-publish-${{ github.ref }}
  cancel-in-progress: false
jobs:
  publish:
    name: npm publish
    runs-on: ubuntu-latest
    environment: Production
    timeout-minutes: 120
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Checkout demo video submodule
        run: git submodule update --init --depth 1 -- assets/demo-video
      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11.7.0
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
          registry-url: https://registry.npmjs.org

      - name: Create isolated npm user configuration
        env:
          NPM_CONFIG_USERCONFIG: ${{ runner.temp }}/npm-publish.npmrc
        run: |
          umask 077
          printf 'registry=https://registry.npmjs.org/\n' > "$NPM_CONFIG_USERCONFIG"

      - name: Install npm 11
        run: npm install -g npm@11

      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Audit production dependencies
        run: pnpm security:audit:production
      - name: Validate stable release identity
        if: ${{ inputs.publish_tag == 'latest' }}
        shell: bash
        run: |
          set -euo pipefail
          version="$(node -p "require('./apps/bootstrap/package.json').version")"
          node ./scripts/stable-release-preflight.mjs \
            --version "$version"

      - name: Validate publish inputs
        env:
          PUBLISH_AUTH_MODE: ${{ inputs.auth_mode }}
          DRY_RUN: ${{ inputs.dry_run }}
          NODE_AUTH_TOKEN: ${{ (inputs.auth_mode == 'new-identity-bootstrap' || inputs.auth_mode == 'missing-trust-recovery') && secrets.NPM_TOKEN || '' }}
          PACKAGES: ${{ inputs.packages }}
          PUBLISH_ALL: ${{ inputs.publish_all }}
          PUBLISH_TAG: ${{ inputs.publish_tag }}
          NPM_CONFIG_USERCONFIG: ${{ runner.temp }}/npm-publish.npmrc
        shell: bash
        run: |
          set -euo pipefail

          trimmed_packages="$(printf '%s' "${PACKAGES:-}" | tr -d '[:space:]')"
          if [ -z "$trimmed_packages" ] && [ "${PUBLISH_ALL}" != "true" ]; then
            echo "packages is empty. Set publish_all=true only when you intentionally want the full public workspace publish plan." >&2
            exit 1
          fi

          if [ "${PUBLISH_AUTH_MODE}" != "oidc" ] && [ -z "${NODE_AUTH_TOKEN:-}" ]; then
            echo "token authentication mode requires the NPM_TOKEN secret." >&2
            exit 1
          fi
          if [ "${PUBLISH_TAG}" = "latest" ]; then
            node ./scripts/stable-npm-release.mjs validate-selection
          fi

      - name: Configure explicit npm authentication mode
        env:
          PUBLISH_AUTH_MODE: ${{ inputs.auth_mode }}
          NODE_AUTH_TOKEN: ${{ (inputs.auth_mode == 'new-identity-bootstrap' || inputs.auth_mode == 'missing-trust-recovery') && secrets.NPM_TOKEN || '' }}
          NPM_CONFIG_USERCONFIG: ${{ runner.temp }}/npm-publish.npmrc
        shell: bash
        run: |
          set -euo pipefail

          if [ "${PUBLISH_AUTH_MODE}" = "oidc" ]; then
            unset NODE_AUTH_TOKEN
            printf 'registry=https://registry.npmjs.org/\n' > "$NPM_CONFIG_USERCONFIG"
            chmod 600 "$NPM_CONFIG_USERCONFIG"
            echo "OIDC mode: no npm token fallback is configured."
            exit 0
          fi

          if [ -z "${NODE_AUTH_TOKEN:-}" ]; then
            echo "token authentication mode requires NPM_TOKEN." >&2
            exit 1
          fi

          cat > "$NPM_CONFIG_USERCONFIG" <<'NPMRC'
          registry=https://registry.npmjs.org/
          //registry.npmjs.org/:_authToken=${NODE_AUTH_TOKEN}
          //registry.npmjs.com/:_authToken=${NODE_AUTH_TOKEN}
          NPMRC

          npm whoami --registry https://registry.npmjs.org

      - name: Prove publish authentication before the first publish
        env:
          NODE_AUTH_TOKEN: ${{ (inputs.auth_mode == 'new-identity-bootstrap' || inputs.auth_mode == 'missing-trust-recovery') && secrets.NPM_TOKEN || '' }}
          NPM_PUBLISH_LATEST_SNAPSHOT: ${{ runner.temp }}/npm-publish-latest-before.json
          NPM_PUBLISH_GUARD_SNAPSHOT: ${{ runner.temp }}/npm-publish-guard.json
          NPM_PUBLISH_TARBALL_DIRECTORY: ${{ runner.temp }}/npm-publish-tarballs
          PACKAGES: ${{ inputs.packages }}
          PUBLISH_ALL: ${{ inputs.publish_all }}
          PUBLISH_AUTH_MODE: ${{ inputs.auth_mode }}
          PUBLISH_TAG: ${{ inputs.publish_tag }}
          TARGET_PROVENANCE_REQUIRED: "true"
          NPM_CONFIG_USERCONFIG: ${{ runner.temp }}/npm-publish.npmrc
        run: |
          rm -rf "$NPM_PUBLISH_TARBALL_DIRECTORY"
          mkdir -p "$NPM_PUBLISH_TARBALL_DIRECTORY"
          node ./scripts/npm-publish-guard.mjs preflight

      - name: Recheck targets before publish
        env:
          NPM_PUBLISH_GUARD_SNAPSHOT: ${{ runner.temp }}/npm-publish-guard.json
          PACKAGES: ${{ inputs.packages }}
          PUBLISH_ALL: ${{ inputs.publish_all }}
        run: node ./scripts/npm-publish-guard.mjs prepublish

      - name: Publish packages
        id: npm_publish
        continue-on-error: true
        env:
          NPM_PUBLISH_GUARD_SNAPSHOT: ${{ runner.temp }}/npm-publish-guard.json
          PUBLISH_AUTH_MODE: ${{ inputs.auth_mode }}
          DRY_RUN: ${{ inputs.dry_run }}
          NPM_CONFIG_PROVENANCE: "true"
          NODE_AUTH_TOKEN: ${{ (inputs.auth_mode == 'new-identity-bootstrap' || inputs.auth_mode == 'missing-trust-recovery') && secrets.NPM_TOKEN || '' }}
          PACKAGES: ${{ inputs.packages }}
          PUBLISH_ALL: ${{ inputs.publish_all }}
          PUBLISH_TAG: ${{ inputs.publish_tag }}
          NPM_CONFIG_USERCONFIG: ${{ runner.temp }}/npm-publish.npmrc
        run: node ./scripts/npm-publish-guard.mjs publish

      - name: Verify npm publish registry and provenance evidence
        id: npm_postflight
        if: ${{ always() && !inputs.dry_run }}
        continue-on-error: true
        env:
          NPM_PUBLISH_GUARD_SNAPSHOT: ${{ runner.temp }}/npm-publish-guard.json
          PACKAGES: ${{ inputs.packages }}
          PUBLISH_ALL: ${{ inputs.publish_all }}
          PUBLISH_AUTH_MODE: ${{ inputs.auth_mode }}
          PUBLISH_TAG: ${{ inputs.publish_tag }}
        run: node ./scripts/npm-publish-guard.mjs postflight

      - name: Build stable Windows portable asset
        id: windows_asset
        if: ${{ !inputs.dry_run && inputs.publish_tag == 'latest' && steps.npm_publish.outcome == 'success' && steps.npm_postflight.outcome == 'success' }}
        env:
          PACKAGES: ${{ inputs.packages }}
          PUBLISH_ALL: ${{ inputs.publish_all }}
        shell: bash
        run: node ./scripts/stable-windows-release.mjs build

      - name: Attest stable Windows portable asset
        if: ${{ steps.windows_asset.outputs.should_publish == 'true' }}
        uses: actions/attest-build-provenance@v3
        with:
          subject-path: ${{ steps.windows_asset.outputs.archive }}

      - name: Publish stable Windows portable asset
        if: ${{ steps.windows_asset.outputs.should_publish == 'true' }}
        env:
          GH_TOKEN: ${{ github.token }}
          ARCHIVE: ${{ steps.windows_asset.outputs.archive }}
          CHECKSUM: ${{ steps.windows_asset.outputs.checksum }}
          RELEASE_TAG: ${{ steps.windows_asset.outputs.tag }}
          VERSION: ${{ steps.windows_asset.outputs.version }}
        shell: bash
        run: node ./scripts/stable-windows-release.mjs publish

      - name: Reconcile stable npm registry
        if: ${{ !inputs.dry_run && inputs.publish_tag == 'latest' && steps.npm_publish.outcome == 'success' && steps.npm_postflight.outcome == 'success' }}
        run: node ./scripts/stable-npm-release.mjs verify-registry

      - name: Preserve npm publish failure
        if: ${{ always() && (steps.npm_publish.outcome == 'failure' || steps.npm_postflight.outcome == 'failure') }}
        run: echo "npm publish or full registry reconciliation failed; preserve this workflow for targeted recovery." >&2; exit 1

      - name: Remove isolated npm credentials
        if: ${{ always() }}
        env:
          NPM_CONFIG_USERCONFIG: ${{ runner.temp }}/npm-publish.npmrc
          NPM_PUBLISH_TARBALL_DIRECTORY: ${{ runner.temp }}/npm-publish-tarballs
          NPM_PUBLISH_GUARD_SNAPSHOT: ${{ runner.temp }}/npm-publish-guard.json
        run: rm -f "$NPM_CONFIG_USERCONFIG" "$NPM_PUBLISH_GUARD_SNAPSHOT"; rm -rf "$NPM_PUBLISH_TARBALL_DIRECTORY"
