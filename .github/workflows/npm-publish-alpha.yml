name: npm Publish
on:
  workflow_dispatch:
    inputs:
      dry_run:
        default: false
        description: Run publish-plan with --dry-run instead of publishing.
        required: false
        type: boolean
      packages:
        description: Comma-separated package names. Leave empty only when publish_all is true.
        required: false
        type: string
      publish_all:
        default: false
        description: Publish the full public workspace plan when packages is empty.
        required: false
        type: boolean
      publish_tag:
        default: alpha
        description: npm dist-tag used when publishing. Use latest for the bootstrap redirect package group when bare npx should resolve to it.
        required: false
        type: string
      bootstrap_with_token:
        default: false
        description: Use NPM_TOKEN only for a new-identity bootstrap or reconciled missing-trust recovery.
        required: false
        type: boolean
permissions:
  attestations: write
  contents: write
  id-token: write
env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"
concurrency:
  group: npm-publish-${{ github.ref }}
  cancel-in-progress: false
jobs:
  publish:
    name: npm publish
    runs-on: ubuntu-latest
    environment: Production
    timeout-minutes: 120
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Checkout demo video submodule
        run: git submodule update --init --depth 1 -- assets/demo-video
      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11.7.0
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
          registry-url: https://registry.npmjs.org

      - name: Install npm 11
        run: npm install -g npm@11

      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Audit production dependencies
        run: pnpm security:audit:production
      - name: Validate stable release identity
        if: ${{ inputs.publish_tag == 'latest' }}
        shell: bash
        run: |
          set -euo pipefail
          version="$(node -p "require('./apps/bootstrap/package.json').version")"
          node ./scripts/stable-release-preflight.mjs \
            --version "$version"

      - name: Validate publish inputs
        env:
          BOOTSTRAP_WITH_TOKEN: ${{ inputs.bootstrap_with_token }}
          DRY_RUN: ${{ inputs.dry_run }}
          NODE_AUTH_TOKEN: ${{ inputs.bootstrap_with_token && secrets.NPM_TOKEN || '' }}
          PACKAGES: ${{ inputs.packages }}
          PUBLISH_ALL: ${{ inputs.publish_all }}
          PUBLISH_TAG: ${{ inputs.publish_tag }}
        shell: bash
        run: |
          set -euo pipefail

          trimmed_packages="$(printf '%s' "${PACKAGES:-}" | tr -d '[:space:]')"
          if [ -z "$trimmed_packages" ] && [ "${PUBLISH_ALL}" != "true" ]; then
            echo "packages is empty. Set publish_all=true only when you intentionally want the full public workspace publish plan." >&2
            exit 1
          fi

          if [ "${BOOTSTRAP_WITH_TOKEN}" = "true" ] && [ -z "${NODE_AUTH_TOKEN:-}" ]; then
            echo "bootstrap_with_token=true requires the NPM_TOKEN secret." >&2
            exit 1
          fi
          if [ "${PUBLISH_TAG}" = "latest" ]; then
            node ./scripts/stable-npm-release.mjs validate-selection
          fi

      - name: Configure npm token authentication
        env:
          BOOTSTRAP_WITH_TOKEN: ${{ inputs.bootstrap_with_token }}
          NODE_AUTH_TOKEN: ${{ inputs.bootstrap_with_token && secrets.NPM_TOKEN || '' }}
        shell: bash
        run: |
          set -euo pipefail

          if [ "${BOOTSTRAP_WITH_TOKEN}" != "true" ]; then
            echo "Trusted Publishing mode: not configuring NPM_TOKEN."
            exit 0
          fi

          if [ -z "${NODE_AUTH_TOKEN:-}" ]; then
            echo "bootstrap_with_token=true requires NPM_TOKEN." >&2
            exit 1
          fi

          cat >> .npmrc <<'NPMRC'
          registry=https://registry.npmjs.org/
          //registry.npmjs.org/:_authToken=${NODE_AUTH_TOKEN}
          //registry.npmjs.com/:_authToken=${NODE_AUTH_TOKEN}
          NPMRC

          npm whoami --registry https://registry.npmjs.org

      - name: Publish packages
        id: npm_publish
        continue-on-error: true
        env:
          BOOTSTRAP_WITH_TOKEN: ${{ inputs.bootstrap_with_token }}
          DRY_RUN: ${{ inputs.dry_run }}
          NPM_CONFIG_PROVENANCE: "true"
          NODE_AUTH_TOKEN: ${{ inputs.bootstrap_with_token && secrets.NPM_TOKEN || '' }}
          PACKAGES: ${{ inputs.packages }}
          PUBLISH_ALL: ${{ inputs.publish_all }}
          PUBLISH_TAG: ${{ inputs.publish_tag }}
        shell: bash
        run: |
          set -euo pipefail

          trimmed_packages="$(printf '%s' "${PACKAGES:-}" | tr -d '[:space:]')"
          if [ -z "$trimmed_packages" ] && [ "${PUBLISH_ALL}" != "true" ]; then
            echo "packages is empty. Set publish_all=true only when you intentionally want the full public workspace publish plan." >&2
            exit 1
          fi

          if [ "${BOOTSTRAP_WITH_TOKEN}" = "true" ]; then
            echo "NPM_TOKEN is configured for an explicitly scoped bootstrap or missing-trust recovery."
          else
            unset NODE_AUTH_TOKEN
            echo "Trusted Publishing mode: npm publish will authenticate through GitHub OIDC."
          fi

          tag="${PUBLISH_TAG:-alpha}"
          args=(--publish --no-git-checks --skip-existing --tag "${tag}" --no-confirm-retry)
          if [ "${DRY_RUN}" = "true" ]; then
            args+=(--dry-run)
          fi
          if [ -n "${PACKAGES}" ]; then
            args+=(--packages "${PACKAGES}")
          fi

          pnpm tools publish-plan -- "${args[@]}"

      - name: Build stable Windows portable asset
        id: windows_asset
        if: ${{ always() && !inputs.dry_run && inputs.publish_tag == 'latest' && steps.npm_publish.outcome != 'skipped' }}
        env:
          PACKAGES: ${{ inputs.packages }}
          PUBLISH_ALL: ${{ inputs.publish_all }}
        shell: bash
        run: node ./scripts/stable-windows-release.mjs build

      - name: Attest stable Windows portable asset
        if: ${{ steps.windows_asset.outputs.should_publish == 'true' }}
        uses: actions/attest-build-provenance@v3
        with:
          subject-path: ${{ steps.windows_asset.outputs.archive }}

      - name: Publish stable Windows portable asset
        if: ${{ steps.windows_asset.outputs.should_publish == 'true' }}
        env:
          GH_TOKEN: ${{ github.token }}
          ARCHIVE: ${{ steps.windows_asset.outputs.archive }}
          CHECKSUM: ${{ steps.windows_asset.outputs.checksum }}
          RELEASE_TAG: ${{ steps.windows_asset.outputs.tag }}
          VERSION: ${{ steps.windows_asset.outputs.version }}
        shell: bash
        run: node ./scripts/stable-windows-release.mjs publish

      - name: Reconcile stable npm registry
        if: ${{ always() && !inputs.dry_run && inputs.publish_tag == 'latest' && steps.npm_publish.outcome != 'skipped' }}
        run: node ./scripts/stable-npm-release.mjs verify-registry

      - name: Preserve npm publish failure
        if: ${{ always() && steps.npm_publish.outcome == 'failure' }}
        run: echo "One or more npm identities failed to publish; preserve the failed workflow for targeted recovery." >&2; exit 1
