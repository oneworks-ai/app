name: Setup cached workspace
description: Setup Node.js and pnpm, restoring an exact platform-specific workspace install when available.

runs:
  using: composite
  steps:
    - name: Setup pnpm
      uses: pnpm/action-setup@v4
      with:
        version: 11.7.0

    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version-file: .node-version
        cache: pnpm
        cache-dependency-path: pnpm-lock.yaml

    - name: Restore workspace dependencies
      id: workspace-cache
      uses: actions/cache@v4
      with:
        path: |
          node_modules
          assets/avatar/node_modules
          apps/*/node_modules
          packages/*/node_modules
          packages/adapters/*/node_modules
          packages/channels/*/node_modules
          packages/plugins/*/node_modules
        key: >-
          workspace-v1-pnpm-11.7.0-${{ runner.os }}-${{ runner.arch }}-${{
          hashFiles('.github/actions/setup-workspace/action.yml', '.node-version', '.npmrc',
          'package.json', 'pnpm-lock.yaml', 'pnpm-workspace.yaml', 'patches/**/*.patch',
          'assets/avatar/package.json', 'apps/*/package.json',
          'packages/*/package.json', 'packages/adapters/*/package.json',
          'packages/channels/*/package.json', 'packages/plugins/*/package.json') }}

    - name: Install workspace dependencies
      if: steps.workspace-cache.outputs.cache-hit != 'true'
      shell: bash
      run: pnpm install --frozen-lockfile
